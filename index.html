<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Личный Дневник</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --accent-color: #4a90e2;
      --border-color: #e1e8ed;
      --muted-color: #7f8c8d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      min-height: 100vh;
    }

    /* Боковая панель со списком дней */
    .sidebar {
      width: 280px;
      background-color: var(--card-bg);
      border-right: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: var(--muted-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .history-list {
      list-style: none;
      overflow-y: auto;
      flex-grow: 1;
    }

    .history-item {
      padding: 10px 12px;
      margin-bottom: 6px;
      border-radius: 6px;
      cursor: pointer;
      background-color: var(--bg-color);
      transition: background-color 0.2s;
      font-size: 0.95rem;
    }

    .history-item:hover {
      background-color: #e8ecef;
    }

    .history-item.active {
      background-color: var(--accent-color);
      color: white;
    }

    /* Основной блок редактора */
    .main-content {
      flex-grow: 1;
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .date-title {
      font-size: 1.8rem;
      font-weight: 600;
    }

    .save-status {
      font-size: 0.85rem;
      color: var(--muted-color);
    }

    .journal-textarea {
      width: 100%;
      flex-grow: 1;
      min-height: 400px;
      padding: 20px;
      font-size: 1.1rem;
      line-height: 1.6;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      resize: none;
      outline: none;
      background-color: var(--card-bg);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .journal-textarea:focus {
      border-color: var(--accent-color);
    }

    .btn-today {
      margin-top: 15px;
      padding: 10px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    /* Адаптивность для мобильных */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        max-height: 200px;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }
      .main-content {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Боковое меню с историей -->
  <aside class="sidebar">
    <h2>Сохранённые дни</h2>
    <ul class="history-list" id="history-list"></ul>
    <button class="btn-today" id="btn-today" onclick="switchToToday()">Вернуться к сегодня</button>
  </aside>

  <!-- Основная область записи -->
  <main class="main-content">
    <div class="header">
      <h1 class="date-title" id="current-date-display">Загрузка...</h1>
      <span class="save-status" id="save-status">Сохранено</span>
    </div>

    <textarea 
      class="journal-textarea" 
      id="journal-input" 
      placeholder="Напишите, как прошёл ваш день..."
    ></textarea>
  </main>

  <script>
    // Вспомогательная функция для формата YYYY-MM-DD
    function getFormattedDate(dateObj) {
      return dateObj.toLocaleDateString('sv');
    }

    // Текущий открытый день (по умолчанию сегодня)
    let selectedDate = getFormattedDate(new Date());
    const todayDate = getFormattedDate(new Date());

    const textarea = document.getElementById('journal-input');
    const dateDisplay = document.getElementById('current-date-display');
    const saveStatus = document.getElementById('save-status');
    const historyList = document.getElementById('history-list');

    // Загрузка записи по ключу даты
    function loadEntry(date) {
      selectedDate = date;
      const savedText = localStorage.getItem(`journal_${date}`);
      textarea.value = savedText || '';
      
      // Блокируем редактирование прошлых дней (по желанию можно убрать эту строку, если хотите редактировать старое)
      textarea.readOnly = (date !== todayDate);
      
      // Обновляем заголовок
      dateDisplay.textContent = (date === todayDate) ? `Сегодня (${date})` : date;
      saveStatus.textContent = (date !== todayDate) ? 'Просмотр архива' : 'Сохранено';

      renderHistory();
    }

    // Автоматическое сохранение
    function saveEntry() {
      if (selectedDate !== todayDate) return; // Сохраняем только сегодняшний день

      saveStatus.textContent = 'Сохранение...';
      localStorage.setItem(`journal_${selectedDate}`, textarea.value);
      
      setTimeout(() => {
        saveStatus.textContent = 'Сохранено в браузер';
      }, 300);

      renderHistory();
    }

    // Отображение списка всех сохраненных дней в левой панели
    function renderHistory() {
      historyList.innerHTML = '';
      
      // Находим все ключи в localStorage, относящиеся к дневнику
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('journal_')) {
          keys.push(key.replace('journal_', ''));
        }
      }

      // Если сегодняшнего дня ещё нет в списке — добавляем для наглядности
      if (!keys.includes(todayDate)) {
        keys.push(todayDate);
      }

      // Сортируем даты от новых к старым
      keys.sort().reverse();

      keys.forEach(date => {
        const li = document.createElement('li');
        li.className = `history-item ${date === selectedDate ? 'active' : ''}`;
        li.textContent = date === todayDate ? `Сегодня (${date})` : date;
        li.onclick = () => loadEntry(date);
        historyList.appendChild(li);
      });
    }

    function switchToToday() {
      loadEntry(todayDate);
    }

    // Слушатели событий
    textarea.addEventListener('input', saveEntry);

    // Первоначальный запуск
    document.addEventListener('DOMContentLoaded', () => {
      loadEntry(todayDate);
    });
  </script>
</body>
</html>
