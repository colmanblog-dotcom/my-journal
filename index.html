<!DOCTYPE html>
<html lang="ru" data-theme="gamer">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 GAMER DAILY HUB — ULTRA</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ===================================================================
           ROOT VARIABLES — ULTRA GAMER
           =================================================================== */
        :root[data-theme="gamer"] {
            --bg: #0a0a0f;
            --bg-secondary: rgba(5, 5, 15, 0.95);
            --card-bg: rgba(10, 10, 25, 0.85);
            --card-border: rgba(0, 255, 200, 0.15);
            --accent-primary: #00ffc8;
            --accent-secondary: #ff00a0;
            --accent-glow: rgba(0, 255, 200, 0.3);
            --text-main: #e0fff5;
            --text-muted: #70b8a8;
            --input-bg: rgba(0, 30, 25, 0.5);
            --input-border: rgba(0, 255, 200, 0.15);
            --shadow-color: rgba(0, 255, 200, 0.15);
            --glass-blur: 16px;
            --theme-transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            --font-display: 'Orbitron', monospace;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        /* ---------- ОСТАЛЬНЫЕ ТЕМЫ СОХРАНЕНЫ ---------- */
        /* ... (все темы из предыдущего кода) ... */

        /* ===================================================================
           GAMER — СПЕЦИАЛЬНЫЕ СТИЛИ
           =================================================================== */
        [data-theme="gamer"] {
            --bg: #0a0a0f;
            --bg-secondary: rgba(5, 5, 15, 0.95);
            --card-bg: rgba(10, 10, 25, 0.85);
            --card-border: rgba(0, 255, 200, 0.2);
            --accent-primary: #00ffc8;
            --accent-secondary: #ff00a0;
            --accent-glow: rgba(0, 255, 200, 0.4);
            --text-main: #e0fff5;
            --text-muted: #70b8a8;
            --input-bg: rgba(0, 30, 25, 0.5);
            --input-border: rgba(0, 255, 200, 0.15);
            --shadow-color: rgba(0, 255, 200, 0.15);
            --glass-blur: 16px;
            --theme-transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            --font-display: 'Orbitron', monospace;
        }

        [data-theme="gamer"] body {
            background: #0a0a0f;
            font-family: var(--font-body);
        }

        /* ---------- ГЕЙМЕРСКИЙ ФОН С ЧАСТИЦАМИ ---------- */
        #particle-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ---------- ГЕЙМЕРСКАЯ КАРТОЧКА ---------- */
        [data-theme="gamer"] .today-card {
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 40px var(--accent-glow), inset 0 0 40px rgba(0, 255, 200, 0.05);
            background: rgba(10, 10, 25, 0.9);
            position: relative;
            overflow: hidden;
        }

        [data-theme="gamer"] .today-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 20px;
            padding: 2px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary), var(--accent-primary));
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: gamerBorder 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gamerBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        [data-theme="gamer"] .today-card>* { position: relative; z-index: 1; }

        /* ---------- HP-BAR (вместо слайдера энергии) ---------- */
        .hp-bar-container {
            width: 100%;
            height: 24px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            border: 2px solid var(--card-border);
            overflow: hidden;
            position: relative;
            cursor: pointer;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
            margin-top: 8px;
        }

        .hp-bar-fill {
            height: 100%;
            width: 50%;
            border-radius: 10px;
            transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s;
            position: relative;
            background: linear-gradient(90deg, #ff0040, #ff6b00, #ffd700, #00ff88);
            background-size: 300% 100%;
            animation: hpGlow 2s ease-in-out infinite alternate;
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.3);
        }

        @keyframes hpGlow {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 0%; }
        }

        .hp-bar-fill::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: hpShine 2s ease-in-out infinite;
        }

        @keyframes hpShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .hp-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 13px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
            z-index: 2;
        }

        /* ---------- УРОВНИ И XP ---------- */
        .level-display {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .level-badge {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 18px;
            color: var(--accent-primary);
            text-shadow: 0 0 20px var(--accent-glow);
            min-width: 60px;
        }

        .level-progress {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            min-width: 80px;
        }

        .level-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 3px;
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 20px var(--accent-glow);
            width: 0%;
        }

        .level-xp-text {
            font-family: var(--font-display);
            font-size: 10px;
            color: var(--text-muted);
            min-width: 60px;
            text-align: right;
        }

        /* ---------- ГЕЙМЕРСКИЙ СТРИК ---------- */
        .streak-gamer {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 28px;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .streak-gamer .streak-label {
            font-size: 12px;
            color: var(--text-muted);
            font-family: var(--font-body);
        }

        .streak-gamer .streak-number {
            animation: streakPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes streakPop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ---------- ГЕЙМЕРСКИЕ ТОСТЫ ---------- */
        .toast.achievement {
            border-color: #ffd700 !important;
            background: rgba(10, 10, 25, 0.95) !important;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.4) !important;
            font-family: var(--font-display);
            font-size: 16px;
            letter-spacing: 1px;
        }

        .toast.achievement::before {
            content: '🏆 ';
        }

        /* ---------- ГЕЙМЕРСКИЕ ГРАФИКИ ---------- */
        [data-theme="gamer"] .chart-box {
            border: 1px solid var(--accent-primary);
            box-shadow: 0 0 30px var(--accent-glow), inset 0 0 30px rgba(0, 255, 200, 0.05);
            position: relative;
            overflow: hidden;
        }

        [data-theme="gamer"] .chart-box::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 200, 0.02) 2px,
                rgba(0, 255, 200, 0.02) 4px);
            pointer-events: none;
            animation: scanLines 8s linear infinite;
        }

        @keyframes scanLines {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* ---------- ДОСТИЖЕНИЯ ---------- */
        .achievement-popup {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(10, 10, 25, 0.95);
            border: 2px solid #ffd700;
            border-radius: 16px;
            padding: 16px 24px;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.4);
            z-index: 9999;
            font-family: var(--font-display);
            transform: translateX(120%);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(20px);
        }

        .achievement-popup.show {
            transform: translateX(0);
        }

        .achievement-popup .title {
            font-size: 14px;
            color: #ffd700;
            letter-spacing: 2px;
        }

        .achievement-popup .desc {
            font-size: 12px;
            color: var(--text-muted);
            font-family: var(--font-body);
        }

        /* ---------- НАВИГАЦИЯ ---------- */
        [data-theme="gamer"] .nav-item.active {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            box-shadow: 0 0 30px var(--accent-glow);
        }

        /* ---------- КНОПКИ ---------- */
        [data-theme="gamer"] .btn-save {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            box-shadow: 0 0 30px var(--accent-glow);
            text-transform: uppercase;
            font-family: var(--font-display);
            letter-spacing: 2px;
        }

        [data-theme="gamer"] .btn-save:hover {
            box-shadow: 0 0 60px var(--accent-glow);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

        <div class="pin-box">

    <!-- ===================================================================
    JAVASCRIPT — ULTRA GAMER

    <script>
        // ===================================================================
        //  PARTICLE SYSTEM
        // ===================================================================
        class ParticleSystem {
            constructor() {
                this.canvas = document.getElementById('particle-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.mouseX = 0;
                this.mouseY = 0;
                this.resize();
                window.addEventListener('resize', () => this.resize());
                window.addEventListener('mousemove', (e) => {
                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;
                });
                this.initParticles(60);
                this.animate();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            initParticles(count) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 0.8,
                        vy: (Math.random() - 0.5) * 0.8,
                        radius: 1.5 + Math.random() * 2.5,
                        alpha: 0.3 + Math.random() * 0.7,
                        pulse: Math.random() * Math.PI * 2,
                        pulseSpeed: 0.01 + Math.random() * 0.03,
                        color: this.getColor()
                    });
                }
            }

            getColor() {
                const colors = [
                    [0, 255, 200],
                    [255, 0, 160],
                    [0, 200, 255],
                    [255, 215, 0],
                    [200, 0, 255]
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                const isGamer = document.documentElement.getAttribute('data-theme') === 'gamer';

                if (!isGamer) {
                    this.ctx.fillStyle = 'transparent';
                    requestAnimationFrame(() => this.animate());
                    return;
                }

                this.particles.forEach((p) => {
                    // Движение
                    p.x += p.vx;
                    p.y += p.vy;

                    // Притяжение к курсору
                    const dx = this.mouseX - p.x;
                    const dy = this.mouseY - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 200) {
                        const force = (200 - dist) / 200 * 0.02;
                        p.vx += dx / dist * force;
                        p.vy += dy / dist * force;
                    }

                    // Возврат к центру
                    p.vx *= 0.999;
                    p.vy *= 0.999;

                    // Границы
                    if (p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > this.canvas.height) p.vy *= -1;

                    // Пульсация
                    p.pulse += p.pulseSpeed;
                    const alpha = p.alpha * (0.7 + 0.3 * Math.sin(p.pulse));

                    // Рисуем частицу
                    const [r, g, b] = p.color;
                    const gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 3);
                    gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha})`);
                    gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.radius * 3, 0, Math.PI * 2);
                    this.ctx.fillStyle = gradient;
                    this.ctx.fill();

                    // Ядро
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                    this.ctx.fill();
                });

                // Рисуем линии между близкими частицами
                for (let i = 0; i < this.particles.length; i++) {
                    for (let j = i + 1; j < this.particles.length; j++) {
                        const p1 = this.particles[i];
                        const p2 = this.particles[j];
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 150) {
                            const alpha = (1 - dist / 150) * 0.2;
                            this.ctx.beginPath();
                            this.ctx.moveTo(p1.x, p1.y);
                            this.ctx.lineTo(p2.x, p2.y);
                            this.ctx.strokeStyle = `rgba(0, 255, 200, ${alpha})`;
                            this.ctx.lineWidth = 0.5;
                            this.ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(() => this.animate());
            }
        }

                return this.getAll().find(item => item.date === today) || null;
            },

            getStreak() {
                const entries = this.getAll();
                if (!entries.length) return 0;
                const dates = entries.map(i => i.date).sort().reverse();
                let streak = 0;
                let checkDate = new Date();
                for (let i = 0; i < dates.length; i++) {
                    const dateStr = checkDate.toISOString().slice(0, 10);
                    if (dates.includes(dateStr)) {
                        streak++;
                        checkDate.setDate(checkDate.getDate() - 1);
                    } else if (i === 0) {
                        checkDate.setDate(checkDate.getDate() - 1);
                        if (dates.includes(checkDate.toISOString().slice(0, 10))) {
                            streak++;
                            checkDate.setDate(checkDate.getDate() - 1);
                        } else break;
                    } else break;
                }
                return streak;
            }

                { name: 'GOLD', xpNeeded: 500, color: '#ffd700' },

                { name: 'DIAMOND', xpNeeded: 2000, color: '#b9f2ff' },
                { name: 'MASTER', xpNeeded: 4000, color: '#ff6b6b' },
                { name: 'LEGEND', xpNeeded: 8000, color: '#ff00ff' }
            ],

            getLevel(xp) {
                let current = 0;
                for (let i = 0; i < this.levels.length; i++) {
                    if (xp >= this.levels[i].xpNeeded) {
                        current = i;
                    }
                }
                return current;
            },

            getProgress(xp) {
                const current = this.getLevel(xp);
                const next = current + 1;
                if (next >= this.levels.length) return 100;
                const currentXp = this.levels[current].xpNeeded;
                const nextXp = this.levels[next].xpNeeded;
                return ((xp - currentXp) / (nextXp - currentXp)) * 100;
            },

            getXPForDay() {
                // Базовая XP за день + бонусы
                let xp = 25; // база
                // Бонус за энергию (если сегодня сохранено)
                const today = Store.findToday();
                if (today && today.energy) {
                    const energy = parseInt(today.energy);
                    xp += energy * 3; // до +30 XP
                }
                if (today && today.goal) xp += 10;
                if (today && today.victory) xp += 10;
                if (today && today.lesson) xp += 5;
                return xp;
            },

            addXP(amount) {
                const currentXP = parseInt(localStorage.getItem('user_xp')) || 0;
                const newXP = currentXP + amount;

                document.getElementById('level-xp-text').textContent =

                    const text = el.textContent.toLowerCase();

                const tab = this._currentTab;

                let count = 0;

                entries.forEach(item => {
                    let content = '';

                        content = item.goal + (item.subgoals ?
                            `<br><small style="color:var(--text-muted)">📌 ${item.subgoals}</small>` :

                        el.dataset.text = content.toLowerCase();
                        el.innerHTML =
                            `<div class="archive-item-date">📅 ${item.formattedDate}</div><div>${content}</div>`;
                        container.appendChild(el);
                    }
                });

                if (count === 0) {
                    container.innerHTML =
                        `<p style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px;">📭 Записей в этой категории пока нет</p>`;
                }
            }
        };

        // ===================================================================
        //  HISTORY
        // ===================================================================
        const History = {
            render() {
                const container = document.getElementById('history-container');
                container.innerHTML = '';
                const entries = Store.getAll().sort((a, b) => new Date(b.date) - new Date(a.date));

                if (!entries.length) {
                    container.innerHTML =
                        '<p style="text-align:center;color:var(--text-muted);padding:20px;">📭 История пуста</p>';
                    return;
                }

                entries.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'history-card';
                    let html = `<div class="history-date">📅 ${item.formattedDate}`;
                    if (item.energy) html += ` ⚡ ${item.energy*10}/100 HP`;
                    html += '</div>';
                    if (item.goal) html += `<p><b>🎯 Цель:</b> ${item.goal}</p>`;
                    if (item.victory) html += `<p style="color:#00ffc8;"><b>🏆 Победа:</b> ${item.victory}</p>`;
                    if (item.lesson) html += `<p><b>💡 Урок:</b> ${item.lesson}</p>`;
                    if (item.word) html += `<p><b>🔥 Слово дня:</b> ${item.word}</p>`;
                    card.innerHTML = html;
                    container.appendChild(card);
                });
            }
        };

        // ===================================================================
        //  BACKUP MANAGER
        // ===================================================================
        const BackupManager = {
            export() {
                const profile = JSON.parse(localStorage.getItem('user_profile_dossier')) || {};
                const avatar = localStorage.getItem('user_avatar_img') || '';
                const theme = localStorage.getItem('user_theme') || 'gamer';
                const pin = localStorage.getItem('user_pin') || '';
                const xp = localStorage.getItem('user_xp') || '0';
                const achievements = JSON.parse(localStorage.getItem('achievements')) || [];

                const payload = {
                    db: Store.getAll(),
                    profile: profile,
                    avatar: avatar,
                    theme: theme,
                    pin: pin,
                    xp: xp,
                    achievements: achievements,
                    exportedAt: new Date().toISOString()
                };

                const dataStr = "data:text/json;charset=utf-8," +
                    encodeURIComponent(JSON.stringify(payload, null, 2));
                const link = document.createElement('a');
                link.href = dataStr;
                link.download = `daily_backup_${DayManager.todayKey}.json`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                Toast.show('💾 Бэкап сохранён!', 'success');
            },

            reset() {
                if (!confirm('⚠️ ТОЧНО очистить ВСЮ историю, досье и статистику?')) return;
                if (!confirm('🔄 Это действие НЕЛЬЗЯ отменить! Продолжить?')) return;

                localStorage.removeItem('daily_goals_db_v4');
                localStorage.removeItem('user_profile_dossier');
                localStorage.removeItem('user_avatar_img');
                localStorage.removeItem('user_xp');
                localStorage.removeItem('achievements');

                document.getElementById('avatar-container').innerHTML =
                    '👤<div class="upload-overlay">📷</div>';
                ['lastname', 'firstname', 'middlename', 'city', 'age'].forEach(f => {
                    document.getElementById(`user-${f}`).value = '';
                });
                DayManager._clearForm();
                document.getElementById('streak-count').textContent = '0';
                document.getElementById('streak-gamer-count').textContent = '0';
                document.getElementById('today-status').textContent = '';

                LevelSystem.render();

                Toast.show('🗑 Вся база очищена!', 'warning');
            }
        };

        // ===================================================================
        //  PIN MANAGER
        // ===================================================================
        const PinManager = {
            init() {
                const savedPin = localStorage.getItem('user_pin');
                const screen = document.getElementById('lock-screen');

                if (savedPin) {
                    screen.style.display = 'flex';
                    document.getElementById('pin-input').focus();
                } else {
                    const want = confirm('🔒 Установить PIN-код для защиты дневника?');
                    if (want) {
                        const newPin = prompt('Введите 4 цифры PIN-кода:');
                        if (newPin && newPin.length === 4 && /^\d{4}$/.test(newPin)) {
                            localStorage.setItem('user_pin', newPin);
                            Toast.show('🔐 PIN-код установлен!', 'success');
                            screen.style.display = 'flex';
                            document.getElementById('pin-input').focus();
                        } else if (newPin !== null) {
                            Toast.show('❌ PIN должен быть 4 цифры', 'error');
                        }
                    }
                }
            },

            check() {
                const savedPin = localStorage.getItem('user_pin');
                const entered = document.getElementById('pin-input').value;

                if (entered === savedPin) {
                    document.getElementById('lock-screen').style.display = 'none';
                    Toast.show('🔓 Добро пожаловать!', 'success');
                } else {
                    Toast.show('❌ Неверный PIN-код!', 'error');
                    document.getElementById('pin-input').value = '';
                    document.getElementById('pin-input').focus();
                }
            }
        };

        // ===================================================================
        //  INIT
        // ===================================================================
        function init() {
            // Запускаем частицы
            new ParticleSystem();

            ThemeManager.init();
            UI.updateAll();
            ProfileManager.load();
            DayManager.load();
            PinManager.init();
            LevelSystem.render();

            // Проверяем достижения при загрузке
            AchievementManager.checkDailyAchievements();

            document.getElementById('pin-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') PinManager.check();
            });
        }

        // Глобальные для onclick
        window.changeTheme = (theme) => ThemeManager.change(theme);
        window.checkPin = () => PinManager.check();
        window.uploadAvatar = (input) => ProfileManager.uploadAvatar(input);
        window.startVoice = (id, btn) => VoiceInput.start(id, btn);
        window.saveToday = () => DayManager.save();
        window.openSection = (name, btn) => UI.openSection(name, btn);
        window.switchArchiveTab = (tab, btn) => ArchiveManager.switchTab(tab, btn);
        window.exportData = () => BackupManager.export();
        window.resetData = () => BackupManager.reset();
        window.updateEnergy = (value) => updateEnergy(value);
        window.setEnergyFromClick = (e) => setEnergyFromClick(e);

        document.addEventListener('DOMContentLoaded', init);
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            init();
        }
    </script>

</body>
</html>
