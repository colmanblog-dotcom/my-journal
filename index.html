<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Расширенный Трекер Дня & Аналитика</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(22, 30, 46, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.12);
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px 100px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo-area h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-area p {
            color: #38bdf8;
            font-size: 13px;
            margin-top: 4px;
            font-weight: 600;
        }

        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 6px;
            border-radius: 16px;
            margin-bottom: 24px;
            position: sticky;
            top: 16px;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .nav-item.active {
            background: linear-gradient(135deg, var(--accent-primary), #4f46e5);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }

        .today-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 25px var(--accent-glow);
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .today-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .today-badge {
            background: #10b981;
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }

        .section-title {
            font-size: 14px;
            font-weight: 800;
            color: #a5b4fc;
            margin: 20px 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-left: 3px solid var(--accent-primary);
            padding-left: 8px;
        }

        .field-group {
            margin-bottom: 16px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .field-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .btn-mic {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--accent-primary);
            color: #a5b4fc;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-mic.recording {
            background: #ef4444 !important;
            color: #fff !important;
            border-color: #ef4444 !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .field-group textarea, .field-group input[type="text"], .field-group select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            color: #fff;
            padding: 12px;
            font-size: 14px;
            outline: none;
        }

        .field-group textarea {
            resize: vertical;
            min-height: 55px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 500px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .btn-save {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            color: #fff;
            font-weight: 800;
            font-size: 16px;
            padding: 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.2s;
            margin-top: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 800;
            color: #a5b4fc;
        }

        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .chart-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chart-box h2 {
            font-size: 15px;
            margin-bottom: 16px;
            color: #a5b4fc;
            width: 100%;
        }

        .donut-wrapper {
            position: relative;
            width: 100%;
            max-width: 240px;
            height: 240px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .history-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 16px;
        }

        .history-date {
            font-weight: 800;
            color: #a5b4fc;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .btn-action {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 8px 12px;
            border-radius: var(--radius-md);
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-area">
                <h1>⚡ Цели & Осознанность</h1>
                <p id="today-date-display">📅 Сегодня: --.--.----</p>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="btn-action" onclick="exportData()">💾 Бэкап</button>
                <button class="btn-action" onclick="resetData()" style="color: #f87171;">🗑</button>
            </div>
        </header>

        <nav class="nav-menu">
            <button class="nav-item active" onclick="openSection('today', this)">🔥 Сегодня</button>
            <button class="nav-item" onclick="openSection('stats', this)">📈 Статистика</button>
            <button class="nav-item" onclick="openSection('history', this)">📚 История</button>
        </nav>

        <!-- SECTION 1: TODAY -->
        <section id="sec-today" class="page-section active">
            <div class="today-card">
                <div class="today-card-header">
                    <span class="today-badge">🎯 Карточка Дня</span>
                </div>

                <!-- БЛОК 1: ТРЕКИНГ СОСТОЯНИЯ -->
                <div class="section-title">⚡ Состояние и Дисциплина</div>
                <div class="grid-2">
                    <div class="field-group">
                        <label>⚡ Энергия (1-10)</label>
                        <input type="number" min="1" max="10" id="today-energy" placeholder="Напр. 8">
                    </div>
                    <div class="field-group">
                        <label>🏃 Спорт / Активность</label>
                        <select id="today-sport">
                            <option value="Нет">❌ Без активности</option>
                            <option value="Легкая">🚶 Прогулка / Зарядка</option>
                            <option value="Тренировка">🏋️ Полноценная тренировка</option>
                            <option value="Кардио">🚴 Кардио / Бег / Вел</option>
                        </select>
                    </div>
                </div>

                <!-- БЛОК 2: ЦЕЛИ И ЗАДАЧИ -->
                <div class="section-title">🎯 Главный Фокус Дня</div>
                <div class="field-group">
                    <div class="label-row">
                        <label>🎯 Главная цель / Задача дня</label>
                        <button class="btn-mic" onclick="startVoice('today-goal', this)">🎤 Продиктовать</button>
                    </div>
                    <textarea id="today-goal" placeholder="Какую главную цель закрываем сегодня?"></textarea>
                </div>

                <div class="field-group">
                    <div class="label-row">
                        <label>📌 Второстепенные задачи (через запятую)</label>
                        <button class="btn-mic" onclick="startVoice('today-subgoals', this)">🎤 Продиктовать</button>
                    </div>
                    <input type="text" id="today-subgoals" placeholder="Например: отправить письмо, купить продукты, позвонить...">
                </div>

                <!-- БЛОК 3: ИТОГИ И МЫСЛИ -->
                <div class="section-title">🧠 Итоги & Осознанность</div>
                
                <div class="field-group">
                    <div class="label-row">
                        <label>🏆 Главная победа дня</label>
                        <button class="btn-mic" onclick="startVoice('today-victory', this)">🎤 Продиктовать</button>
                    </div>
                    <textarea id="today-victory" placeholder="Что сегодня получилось лучше всего? В чём красавчик?"></textarea>
                </div>

                <div class="field-group">
                    <div class="label-row">
                        <label>❤️ За что благодарен сегодня</label>
                        <button class="btn-mic" onclick="startVoice('today-thanks', this)">🎤 Продиктовать</button>
                    </div>
                    <textarea id="today-thanks" placeholder="Кому или чему благодарен..."></textarea>
                </div>

                <div class="field-group">
                    <div class="label-row">
                        <label>🚫 Отказ дня</label>
                        <button class="btn-mic" onclick="startVoice('today-refusal', this)">🎤 Продиктовать</button>
                    </div>
                    <textarea id="today-refusal" placeholder="Чему или кому сказал «нет»..."></textarea>
                </div>

                <div class="grid-2">
                    <div class="field-group">
                        <div class="label-row">
                            <label>💡 Главный урок</label>
                            <button class="btn-mic" onclick="startVoice('today-lesson', this)">🎤</button>
                        </div>
                        <textarea id="today-lesson" placeholder="Что понял за день..."></textarea>
                    </div>
                    <div class="field-group">
                        <div class="label-row">
                            <label>🔥 Слово дня</label>
                            <button class="btn-mic" onclick="startVoice('today-word', this)">🎤</button>
                        </div>
                        <textarea id="today-word" placeholder="Девиз дня..."></textarea>
                    </div>
                </div>

                <button class="btn-save" onclick="saveToday()">Сохранить день и отправить в статистику ✅</button>
            </div>
        </section>

        <!-- SECTION 2: STATS -->
        <section id="sec-stats" class="page-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Всего дней</h3>
                    <div class="value" id="stat-total-days">0</div>
                </div>
                <div class="stat-card">
                    <h3>Средняя энергия</h3>
                    <div class="value" id="stat-avg-energy">0.0</div>
                </div>
            </div>

            <div class="charts-container">
                <div class="chart-box">
                    <h2>🍩 Распределение энергии</h2>
                    <div class="donut-wrapper">
                        <canvas id="energyCategoryDonutChart"></canvas>
                    </div>
                </div>
                <div class="chart-box" style="justify-content: center;">
                    <h2>📈 Динамика энергии</h2>
                    <canvas id="energyChart" height="180"></canvas>
                </div>
            </div>
        </section>

        <!-- SECTION 3: HISTORY -->
        <section id="sec-history" class="page-section">
            <div id="history-container" class="history-list"></div>
        </section>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('daily_goals_db')) || [];
        const todayKey = new Date().toISOString().slice(0, 10);
        const formattedDate = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

        let energyChartInstance = null;
        let energyCategoryDonutInstance = null;

        function init() {
            document.getElementById('today-date-display').innerText = `📅 Сегодня: ${formattedDate}`;
            loadTodayData();
        }

        function startVoice(targetId, btn) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert("Ваш браузер не поддерживает прямое распознавание. Используйте микрофон на клавиатуре устройства.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;

            recognition.onstart = function() {
                btn.classList.add('recording');
                btn.innerHTML = '🔴...';
            };

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                const field = document.getElementById(targetId);
                if (field.value) {
                    field.value += ' ' + text;
                } else {
                    field.value = text;
                }
            };

            recognition.onerror = function(event) {
                alert("Ошибка распознавания: " + event.error);
            };

            recognition.onend = function() {
                btn.classList.remove('recording');
                btn.innerHTML = '🎤';
            };

            recognition.start();
        }

        function loadTodayData() {
            const todayRecord = db.find(item => item.date === todayKey);
            if (todayRecord) {
                document.getElementById('today-energy').value = todayRecord.energy || '';
                document.getElementById('today-sport').value = todayRecord.sport || 'Нет';
                document.getElementById('today-goal').value = todayRecord.goal || '';
                document.getElementById('today-subgoals').value = todayRecord.subgoals || '';
                document.getElementById('today-victory').value = todayRecord.victory || '';
                document.getElementById('today-thanks').value = todayRecord.thanks || '';
                document.getElementById('today-refusal').value = todayRecord.refusal || '';
                document.getElementById('today-lesson').value = todayRecord.lesson || '';
                document.getElementById('today-word').value = todayRecord.word || '';
            }
        }

        function saveToday() {
            const record = {
                date: todayKey,
                formattedDate: formattedDate,
                energy: document.getElementById('today-energy').value,
                sport: document.getElementById('today-sport').value,
                goal: document.getElementById('today-goal').value,
                subgoals: document.getElementById('today-subgoals').value,
                victory: document.getElementById('today-victory').value,
                thanks: document.getElementById('today-thanks').value,
                refusal: document.getElementById('today-refusal').value,
                lesson: document.getElementById('today-lesson').value,
                word: document.getElementById('today-word').value
            };

            const existingIndex = db.findIndex(item => item.date === todayKey);
            if (existingIndex >= 0) {
                db[existingIndex] = record;
            } else {
                db.push(record);
            }

            localStorage.setItem('daily_goals_db', JSON.stringify(db));
            alert('День сохранён! 🚀');
        }

        function openSection(secName, btn) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

            document.getElementById(`sec-${secName}`).classList.add('active');
            btn.classList.add('active');

            if (secName === 'stats') renderStats();
            if (secName === 'history') renderHistory();
        }

        function renderStats() {
            document.getElementById('stat-total-days').innerText = db.length;

            let totalEnergy = 0;
            let energyCount = 0;
            let high = 0, med = 0, low = 0;

            const labels = [];
            const energyValues = [];

            const sortedDb = [...db].sort((a, b) => new Date(a.date) - new Date(b.date));

            sortedDb.forEach(item => {
                labels.push(item.formattedDate.split(' ')[0] + ' ' + item.formattedDate.split(' ')[1]);
                if (item.energy) {
                    const e = parseFloat(item.energy);
                    totalEnergy += e;
                    energyCount++;
                    energyValues.push(e);

                    if (e >= 8) high++;
                    else if (e >= 5) med++;
                    else if (e >= 1) low++;
                } else {
                    energyValues.push(null);
                }
            });

            document.getElementById('stat-avg-energy').innerText = energyCount > 0 ? (totalEnergy / energyCount).toFixed(1) : '0.0';

            const ctxDonut = document.getElementById('energyCategoryDonutChart').getContext('2d');
            if (energyCategoryDonutInstance) energyCategoryDonutInstance.destroy();
            energyCategoryDonutInstance = new Chart(ctxDonut, {
                type: 'doughnut',
                data: {
                    labels: ['Высокая (8-10)', 'Средняя (5-7)', 'Низкая (1-4)'],
                    datasets: [{
                        data: [high, med, low],
                        backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#f8fafc' } } }
                }
            });

            const ctxLine = document.getElementById('energyChart').getContext('2d');
            if (energyChartInstance) energyChartInstance.destroy();
            energyChartInstance = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Энергия',
                        data: energyValues,
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.2)',
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#ec4899'
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { min: 0, max: 10, ticks: { color: '#94a3b8' } },
                        x: { ticks: { color: '#94a3b8' } }
                    },
                    plugins: { legend: { labels: { color: '#f8fafc' } } }
                }
            });
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            container.innerHTML = '';

            if (db.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">История пока пуста.</p>';
                return;
            }

            const sortedDb = [...db].sort((a, b) => new Date(b.date) - new Date(a.date));

            sortedDb.forEach(item => {
                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div class="history-date">📅 ${item.formattedDate} ${item.energy ? ' (⚡ ' + item.energy + '/10)' : ''} ${item.sport && item.sport !== 'Нет' ? ' | 🏃 ' + item.sport : ''}</div>
                    ${item.goal ? '<p style="font-size:13px; margin-bottom:4px;"><b>🎯 Цель:</b> ' + item.goal + '</p>' : ''}
                    ${item.subgoals ? '<p style="font-size:13px; margin-bottom:4px;"><b>📌 Задачи:</b> ' + item.subgoals + '</p>' : ''}
                    ${item.victory ? '<p style="font-size:13px; margin-bottom:4px; color:#10b981;"><b>🏆 Победа:</b> ' + item.victory + '</p>' : ''}
                    ${item.thanks ? '<p style="font-size:13px; margin-bottom:4px;"><b>❤️ Благодарность:</b> ' + item.thanks + '</p>' : ''}
                    ${item.refusal ? '<p style="font-size:13px; margin-bottom:4px;"><b>🚫 Отказ:</b> ' + item.refusal + '</p>' : ''}
                    ${item.lesson ? '<p style="font-size:13px; margin-bottom:4px;"><b>💡 Урок:</b> ' + item.lesson + '</p>' : ''}
                    ${item.word ? '<p style="font-size:13px;"><b>🔥 Слово:</b> ' + item.word + '</p>' : ''}
                `;
                container.appendChild(card);
            });
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `goals_backup_${todayKey}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function resetData() {
            if (confirm("Точно очистить всю историю и статистику?")) {
                localStorage.removeItem('daily_goals_db');
                db = [];
                init();
                alert('Всё очищено!');
            }
        }

        window.onload = init;
    </script>
</body>
</html>
