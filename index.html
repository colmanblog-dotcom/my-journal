<!DOCTYPE html>
<html lang="ru" data-theme="cyber">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Executive Daily Hub v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root[data-theme="cyber"] {
            --bg: #090d16;
            --card-bg: rgba(22, 30, 46, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.12);
        }

        :root[data-theme="oled"] {
            --bg: #000000;
            --card-bg: #0d0d0d;
            --card-border: rgba(255, 255, 255, 0.15);
            --accent-primary: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --text-main: #ffffff;
            --text-muted: #71717a;
            --input-bg: #18181b;
            --input-border: #27272a;
        }

        :root[data-theme="gold"] {
            --bg: #0f0e0c;
            --card-bg: rgba(28, 25, 23, 0.85);
            --card-border: rgba(217, 119, 6, 0.2);
            --accent-primary: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.3);
            --text-main: #fef3c7;
            --text-muted: #a1a1aa;
            --input-bg: rgba(44, 36, 22, 0.6);
            --input-border: rgba(217, 119, 6, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px 100px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        /* PIN LOCK SCREEN */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .pin-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 340px;
            width: 100%;
        }

        .pin-input {
            width: 100%;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
            padding: 12px;
            margin: 20px 0;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
        }

        /* TOAST NOTIFICATION */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--card-bg);
            border: 1px solid var(--accent-primary);
            box-shadow: 0 8px 25px var(--accent-glow);
            color: var(--text-main);
            padding: 14px 24px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            backdrop-filter: blur(12px);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        header {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* СТИЛИ ДОСЬЕ В ШАПКЕ */
        .dossier-card {
            display: flex;
            gap: 20px;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .dossier-avatar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .dossier-avatar {
            width: 110px;
            height: 110px;
            border-radius: 18px;
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-glow);
            object-fit: cover;
            background: var(--input-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 32px;
            overflow: hidden;
        }

        .dossier-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-upload-photo {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .dossier-fields {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .dossier-field-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dossier-field-row label {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            width: 80px;
            flex-shrink: 0;
        }

        .dossier-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
        }

        .dossier-input:focus {
            border-color: var(--accent-primary);
        }

        .dossier-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        @media (max-width: 580px) {
            .dossier-card {
                flex-direction: column;
                align-items: stretch;
            }
            .dossier-avatar-wrapper {
                align-items: center;
            }
            .dossier-field-row label {
                width: 70px;
            }
            .dossier-grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .streak-badge {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        .theme-selector {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 8px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 6px;
            border-radius: 16px;
            margin-bottom: 24px;
            position: sticky;
            top: 16px;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .nav-item.active {
            background: var(--accent-primary);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .page-section { display: none; }
        .page-section.active { display: block; }

        .today-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 25px var(--accent-glow);
            border-radius: 20px;
            padding: 24px;
        }

        .today-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
        }

        .section-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--accent-primary);
            margin: 20px 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-left: 3px solid var(--accent-primary);
            padding-left: 8px;
        }

        .field-group { margin-bottom: 16px; }
        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .field-group label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

        .btn-mic {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--accent-primary);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-mic.recording {
            background: #ef4444 !important;
            color: #fff !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .field-group textarea, .field-group input[type="text"], .field-group select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-main);
            padding: 12px;
            font-size: 14px;
            outline: none;
        }

        .energy-range {
            width: 100%;
            height: 8px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            outline: none;
            accent-color: var(--accent-primary);
            cursor: pointer;
            margin-top: 8px;
        }

        .field-group textarea { resize: vertical; min-height: 55px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        @media (max-width: 500px) { .grid-2 { grid-template-columns: 1fr; } }

        .btn-save {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            color: #fff;
            font-weight: 800;
            font-size: 16px;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            margin-top: 20px;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; text-align: center; }
        .stat-card h3 { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .stat-card .value { font-size: 32px; font-weight: 800; color: var(--accent-primary); }

        .charts-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .chart-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .chart-box h2 { font-size: 15px; margin-bottom: 16px; color: var(--accent-primary); width: 100%; }
        .donut-wrapper { position: relative; width: 100%; max-width: 240px; height: 240px; }

        .subtabs-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
        .subtab-btn { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .subtab-btn.active { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }

        .archive-list, .history-list { display: flex; flex-direction: column; gap: 12px; }
        .archive-item, .history-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; font-size: 14px; }
        .archive-item-date, .history-date { font-size: 12px; color: var(--accent-primary); font-weight: 800; margin-bottom: 4px; }

        .btn-action { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- PIN LOCK OVERLAY -->
    <div id="lock-screen" style="display: none;">
        <div class="pin-box">
            <h2 style="font-size: 18px; margin-bottom: 6px;" id="pin-title">🔒 Вход по PIN</h2>
            <p style="font-size: 12px; color: var(--text-muted);" id="pin-sub">Введите ваш код доступа</p>
            <input type="password" id="pin-input" class="pin-input" maxlength="4" placeholder="••••">
            <button class="btn-save" style="margin-top:0; padding:12px;" onclick="checkPin()">Войти</button>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">🚀 День сохранён!</div>

    <div class="container">
        <header>
            <!-- МИНИ-ДОСЬЕ СВЕРХУ -->
            <div class="dossier-card">
                <div class="dossier-avatar-wrapper">
                    <div class="dossier-avatar" id="avatar-container">
                        👤
                    </div>
                    <label class="btn-upload-photo">
                        📷 Изменить
                        <input type="file" id="avatar-input" accept="image/*" style="display: none;" onchange="uploadAvatar(this)">
                    </label>
                </div>

                <div class="dossier-fields">
                    <div class="dossier-field-row">
                        <label>Фамилия</label>
                        <input type="text" id="user-lastname" class="dossier-input" placeholder="Введите фамилию..." onchange="saveProfileData()">
                    </div>
                    <div class="dossier-field-row">
                        <label>Имя</label>
                        <input type="text" id="user-firstname" class="dossier-input" placeholder="Введите имя..." onchange="saveProfileData()">
                    </div>
                    <div class="dossier-field-row">
                        <label>Отчество</label>
                        <input type="text" id="user-middlename" class="dossier-input" placeholder="Введите отчество..." onchange="saveProfileData()">
                    </div>
                    <div class="dossier-grid-2" style="margin-top: 2px;">
                        <div class="dossier-field-row">
                            <label>Город</label>
                            <input type="text" id="user-city" class="dossier-input" placeholder="Город..." onchange="saveProfileData()">
                        </div>
                        <div class="dossier-field-row">
                            <label>Возраст</label>
                            <input type="text" id="user-age" class="dossier-input" placeholder="Возраст..." onchange="saveProfileData()">
                        </div>
                    </div>
                </div>
            </div>

            <!-- УПРАВЛЕНИЕ И СТАТУС -->
            <div class="header-controls">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <p id="today-date-display" style="font-size: 12px; color: var(--text-muted);">📅 Сегодня: --.--.----</p>
                    <div class="streak-badge">🔥 <span id="streak-count">0</span> дн.</div>
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <select class="theme-selector" onchange="changeTheme(this.value)" id="theme-select">
                        <option value="cyber">🌌 Cyber</option>
                        <option value="oled">🖤 OLED</option>
                        <option value="gold">👑 Gold</option>
                    </select>
                    <button class="btn-action" onclick="exportData()">💾 Бэкап</button>
                    <button class="btn-action" onclick="resetData()" style="color: #f87171;">🗑</button>
                </div>
            </div>
        </header>

        <nav class="nav-menu">
            <button class="nav-item active" onclick="openSection('today', this)">🔥 Сегодня</button>
            <button class="nav-item" onclick="openSection('stats', this)">📈 Статистика</button>
            <button class="nav-item" onclick="openSection('history', this)">📚 История</button>
        </nav>

        <!-- SECTION 1: TODAY -->
        <section id="sec-today" class="page-section active">
            <div class="today-card">
                <div class="today-card-header">
                    <span style="background: var(--accent-primary); color:#fff; font-weight:800; font-size:12px; padding:4px 12px; border-radius:20px;">🎯 Карточка Дня</span>
                </div>

                <div class="section-title">⚡ Состояние и Дисциплина</div>
                <div class="grid-2">
                    <div class="field-group">
                        <div class="label-row">
                            <label>⚡ Энергия: <span id="energy-val" style="color:var(--accent-primary); font-weight:800;">5</span>/10</label>
                        </div>
                        <input type="range" min="1" max="10" value="5" id="today-energy" class="energy-range" oninput="document.getElementById('energy-val').innerText = this.value">
                    </div>
                    <div class="field-group">
                        <label>🏃 Спорт / Активность</label>
                        <select id="today-sport">
                            <option value="Нет">❌ Без активности</option>
                            <option value="Легкая">🚶 Прогулка / Зарядка</option>
                            <option value="Тренировка">🏋️ Полноценная тренировка</option>
                            <option value="Кардио">🚴 Кардио / Бег / Вел</option>
                        </select>
                    </div>
                </div>

                <div class="section-title">🎯 Главный Фокус Дня</div>
                <div class="field-group">
                    <div class="label-row">
                        <label>🎯 Главная цель / Задача дня</label>
                        <button class="btn-mic" onclick="startVoice('today-goal', this)">🎤 Продиктовать</button>
                    </div>
                    <textarea id="today-goal" placeholder="Какую главную цель закрываем сегодня?"></textarea>
                </div>

                <div class="field-group">
                    <div class="label-row">
                        <label>📌 Второстепенные задачи (через запятую)</label>
                        <button class="btn-mic" onclick="startVoice('today-subgoals', this)">🎤 Продиктовать</button>
                    </div>
                    <input type="text" id="today-subgoals" placeholder="Например: отправить письмо, купить продукты...">
                </div>

                <div class="section-title">🧠 Итоги & Осознанность</div>
                
                <div class="field-group">
                    <div class="label-row">
                        <label>🏆 Главная победа дня</label>
                        <button class="btn-mic" onclick="startVoice('today-victory', this)">🎤 Продиктовать</button>
                    </div>
                    <textarea id="today-victory" placeholder="Что сегодня получилось лучше всего?"></textarea>
                </div>

                <div class="field-group">
                    <div class="label-row">
                        <label>❤️ За что благодарен сегодня</label>
                        <button class="btn-mic" onclick="startVoice('today-thanks', this)">🎤 Продиктовать</button>
                    </div>
                    <textarea id="today-thanks" placeholder="Кому или чему благодарен..."></textarea>
                </div>

                <div class="field-group">
                    <div class="label-row">
                        <label>🚫 Отказ дня</label>
                        <button class="btn-mic" onclick="startVoice('today-refusal', this)">🎤 Продиктовать</button>
                    </div>
                    <textarea id="today-refusal" placeholder="Чему или кому сказал «нет»..."></textarea>
                </div>

                <div class="grid-2">
                    <div class="field-group">
                        <div class="label-row">
                            <label>💡 Главный урок</label>
                            <button class="btn-mic" onclick="startVoice('today-lesson', this)">🎤</button>
                        </div>
                        <textarea id="today-lesson" placeholder="Что понял за день..."></textarea>
                    </div>
                    <div class="field-group">
                        <div class="label-row">
                            <label>🔥 Слово дня</label>
                            <button class="btn-mic" onclick="startVoice('today-word', this)">🎤</button>
                        </div>
                        <textarea id="today-word" placeholder="Девиз дня..."></textarea>
                    </div>
                </div>

                <button class="btn-save" onclick="saveToday()">Сохранить день и отправить в статистику ✅</button>
            </div>
        </section>

        <!-- SECTION 2: STATS -->
        <section id="sec-stats" class="page-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Всего дней</h3>
                    <div class="value" id="stat-total-days">0</div>
                </div>
                <div class="stat-card">
                    <h3>Средняя энергия</h3>
                    <div class="value" id="stat-avg-energy">0.0</div>
                </div>
                <div class="stat-card">
                    <h3>Закрыто целей</h3>
                    <div class="value" id="stat-goals-count">0</div>
                </div>
            </div>

            <div class="charts-container">
                <div class="chart-box">
                    <h2>🍩 Распределение энергии</h2>
                    <div class="donut-wrapper">
                        <canvas id="energyCategoryDonutChart"></canvas>
                    </div>
                </div>
                <div class="chart-box" style="justify-content: center;">
                    <h2>📈 Динамика энергии</h2>
                    <canvas id="energyChart" height="180"></canvas>
                </div>
            </div>

            <div class="section-title">📊 Архив заслуг и записей</div>
            
            <div class="subtabs-nav">
                <button class="subtab-btn active" onclick="switchArchiveTab('goals', this)">🎯 Цели</button>
                <button class="subtab-btn" onclick="switchArchiveTab('victories', this)">🏆 Победы</button>
                <button class="subtab-btn" onclick="switchArchiveTab('refusals', this)">🚫 Отказы («Нет»)</button>
                <button class="subtab-btn" onclick="switchArchiveTab('lessons', this)">💡 Уроки</button>
                <button class="subtab-btn" onclick="switchArchiveTab('thanks', this)">❤️ Благодарности</button>
            </div>

            <div id="archive-content-container" class="archive-list"></div>
        </section>

        <!-- SECTION 3: HISTORY -->
        <section id="sec-history" class="page-section">
            <div id="history-container" class="history-list"></div>
        </section>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('daily_goals_db')) || [];
        const todayKey = new Date().toISOString().slice(0, 10);
        const formattedDate = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

        let energyChartInstance = null;
        let energyCategoryDonutInstance = null;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function changeTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('user_theme', themeName);
        }

        function initPin() {
            const savedPin = localStorage.getItem('user_pin');
            const lockScreen = document.getElementById('lock-screen');
            if (savedPin) {
                lockScreen.style.display = 'flex';
            } else {
                const wantPin = confirm("Хотите установить 4-значный PIN-код для защиты дневника?");
                if (wantPin) {
                    const newPin = prompt("Введите 4 цифры нового PIN-кода:");
                    if (newPin && newPin.length === 4) {
                        localStorage.setItem('user_pin', newPin);
                        showToast("PIN-код установлен!");
                    }
                }
            }
        }

        function checkPin() {
            const savedPin = localStorage.getItem('user_pin');
            const entered = document.getElementById('pin-input').value;
            if (entered === savedPin) {
                document.getElementById('lock-screen').style.display = 'none';
            } else {
                showToast("❌ Неверный PIN-код!");
            }
        }

        function calculateStreak() {
            if (db.length === 0) return 0;
            const dates = db.map(i => i.date).sort().reverse();
            let streak = 0;
            let checkDate = new Date();

            for (let i = 0; i < dates.length; i++) {
                const dateStr = checkDate.toISOString().slice(0, 10);
                if (dates.includes(dateStr)) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else if (i === 0) {
                    checkDate.setDate(checkDate.getDate() - 1);
                    const yesterdayStr = checkDate.toISOString().slice(0, 10);
                    if (dates.includes(yesterdayStr)) {
                        streak++;
                        checkDate.setDate(checkDate.getDate() - 1);
                    } else break;
                } else break;
            }
            return streak;
        }

        /* СОХРАНЕНИЕ И ЗАГРУЗКА ДАННЫХ ПРОФИЛЯ/ДОСЬЕ */
        function saveProfileData() {
            const profile = {
                lastname: document.getElementById('user-lastname').value,
                firstname: document.getElementById('user-firstname').value,
                middlename: document.getElementById('user-middlename').value,
                city: document.getElementById('user-city').value,
                age: document.getElementById('user-age').value
            };
            localStorage.setItem('user_profile_dossier', JSON.stringify(profile));
        }

        function loadProfileData() {
            const profile = JSON.parse(localStorage.getItem('user_profile_dossier')) || {};
            document.getElementById('user-lastname').value = profile.lastname || '';
            document.getElementById('user-firstname').value = profile.firstname || '';
            document.getElementById('user-middlename').value = profile.middlename || '';
            document.getElementById('user-city').value = profile.city || '';
            document.getElementById('user-age').value = profile.age || '';

            const savedAvatar = localStorage.getItem('user_avatar_img');
            if (savedAvatar) {
                document.getElementById('avatar-container').innerHTML = `<img src="${savedAvatar}" alt="Avatar">`;
            }
        }

        function uploadAvatar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Img = e.target.result;
                    localStorage.setItem('user_avatar_img', base64Img);
                    document.getElementById('avatar-container').innerHTML = `<img src="${base64Img}" alt="Avatar">`;
                    showToast("📷 Фотография обновлена!");
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function init() {
            const savedTheme = localStorage.getItem('user_theme') || 'cyber';
            changeTheme(savedTheme);
            document.getElementById('theme-select').value = savedTheme;

            document.getElementById('today-date-display').innerText = `📅 Сегодня: ${formattedDate}`;
            document.getElementById('streak-count').innerText = calculateStreak();

            loadProfileData();
            initPin();
            loadTodayData();
        }

        function startVoice(targetId, btn) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showToast("❌ Бро, браузер не поддерживает voice");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.onstart = () => { btn.classList.add('recording'); btn.innerHTML = '🔴...'; };
            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                const field = document.getElementById(targetId);
                field.value = field.value ? field.value + ' ' + text : text;
            };
            recognition.onend = () => { btn.classList.remove('recording'); btn.innerHTML = '🎤'; };
            recognition.start();
        }

        function loadTodayData() {
            const todayRecord = db.find(item => item.date === todayKey);
            if (todayRecord) {
                const energyVal = todayRecord.energy || '5';
                document.getElementById('today-energy').value = energyVal;
                document.getElementById('energy-val').innerText = energyVal;
                document.getElementById('today-sport').value = todayRecord.sport || 'Нет';
                document.getElementById('today-goal').value = todayRecord.goal || '';
                document.getElementById('today-subgoals').value = todayRecord.subgoals || '';
                document.getElementById('today-victory').value = todayRecord.victory || '';
                document.getElementById('today-thanks').value = todayRecord.thanks || '';
                document.getElementById('today-refusal').value = todayRecord.refusal || '';
                document.getElementById('today-lesson').value = todayRecord.lesson || '';
                document.getElementById('today-word').value = todayRecord.word || '';
            }
        }

        function clearTodayForm() {
            document.getElementById('today-energy').value = '5';
            document.getElementById('energy-val').innerText = '5';
            document.getElementById('today-sport').value = 'Нет';
            document.getElementById('today-goal').value = '';
            document.getElementById('today-subgoals').value = '';
            document.getElementById('today-victory').value = '';
            document.getElementById('today-thanks').value = '';
            document.getElementById('today-refusal').value = '';
            document.getElementById('today-lesson').value = '';
            document.getElementById('today-word').value = '';
        }

        function saveToday() {
            const record = {
                date: todayKey,
                formattedDate: formattedDate,
                energy: document.getElementById('today-energy').value,
                sport: document.getElementById('today-sport').value,
                goal: document.getElementById('today-goal').value,
                subgoals: document.getElementById('today-subgoals').value,
                victory: document.getElementById('today-victory').value,
                thanks: document.getElementById('today-thanks').value,
                refusal: document.getElementById('today-refusal').value,
                lesson: document.getElementById('today-lesson').value,
                word: document.getElementById('today-word').value
            };

            const existingIndex = db.findIndex(item => item.date === todayKey);
            if (existingIndex >= 0) db[existingIndex] = record;
            else db.push(record);

            localStorage.setItem('daily_goals_db', JSON.stringify(db));
            clearTodayForm();
            document.getElementById('streak-count').innerText = calculateStreak();
            showToast("🚀 День успешно сохранён!");
        }

        function openSection(secName, btn) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

            document.getElementById(`sec-${secName}`).classList.add('active');
            btn.classList.add('active');

            if (secName === 'stats') {
                renderStats();
                switchArchiveTab('goals', document.querySelector('.subtab-btn'));
            }
            if (secName === 'history') renderHistory();
        }

        function renderStats() {
            document.getElementById('stat-total-days').innerText = db.length;
            let totalEnergy = 0, energyCount = 0, goalsCount = 0;
            let high = 0, med = 0, low = 0;
            const labels = [], energyValues = [];
            const sortedDb = [...db].sort((a, b) => new Date(a.date) - new Date(b.date));

            sortedDb.forEach(item => {
                labels.push(item.formattedDate.split(' ')[0] + ' ' + item.formattedDate.split(' ')[1]);
                if (item.goal) goalsCount++;
                if (item.energy) {
                    const e = parseFloat(item.energy);
                    totalEnergy += e;
                    energyCount++;
                    energyValues.push(e);
                    if (e >= 8) high++;
                    else if (e >= 5) med++;
                    else if (e >= 1) low++;
                }
            });

            document.getElementById('stat-avg-energy').innerText = energyCount > 0 ? (totalEnergy / energyCount).toFixed(1) : '0.0';
            document.getElementById('stat-goals-count').innerText = goalsCount;

            const ctxDonut = document.getElementById('energyCategoryDonutChart').getContext('2d');
            if (energyCategoryDonutInstance) energyCategoryDonutInstance.destroy();
            energyCategoryDonutInstance = new Chart(ctxDonut, {
                type: 'doughnut',
                data: {
                    labels: ['Высокая (8-10)', 'Средняя (5-7)', 'Низкая (1-4)'],
                    datasets: [{ data: [high, med, low], backgroundColor: ['#10b981', '#f59e0b', '#ef4444'], borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8' } } } }
            });

            const ctxLine = document.getElementById('energyChart').getContext('2d');
            if (energyChartInstance) energyChartInstance.destroy();
            energyChartInstance = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{ label: 'Энергия', data: energyValues, borderColor: '#6366f1', backgroundColor: 'rgba(99, 102, 241, 0.2)', fill: true, tension: 0.3 }]
                },
                options: { responsive: true, scales: { y: { min: 0, max: 10 } } }
            });
        }

        function switchArchiveTab(type, btn) {
            document.querySelectorAll('.subtab-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            const container = document.getElementById('archive-content-container');
            container.innerHTML = '';
            const sortedDb = [...db].sort((a, b) => new Date(b.date) - new Date(a.date));
            let itemsFound = 0;

            sortedDb.forEach(item => {
                let content = '';
                if (type === 'goals' && item.goal) content = item.goal + (item.subgoals ? `<br><small style="color:var(--text-muted)">📌 Второстепенные: ${item.subgoals}</small>` : '');
                if (type === 'victories' && item.victory) content = item.victory;
                if (type === 'refusals' && item.refusal) content = item.refusal;
                if (type === 'lessons' && item.lesson) content = item.lesson;
                if (type === 'thanks' && item.thanks) content = item.thanks;

                if (content) {
                    itemsFound++;
                    const el = document.createElement('div');
                    el.className = 'archive-item';
                    el.innerHTML = `<div class="archive-item-date">📅 ${item.formattedDate}</div><div>${content}</div>`;
                    container.appendChild(el);
                }
            });

            if (itemsFound === 0) container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 20px;">Записей пока нет.</p>';
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            container.innerHTML = '';
            if (db.length === 0) { container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">История пуста.</p>'; return; }
            const sortedDb = [...db].sort((a, b) => new Date(b.date) - new Date(a.date));

            sortedDb.forEach(item => {
                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div class="history-date">📅 ${item.formattedDate} ${item.energy ? ' (⚡ ' + item.energy + '/10)' : ''}</div>
                    ${item.goal ? '<p><b>🎯 Цель:</b> ' + item.goal + '</p>' : ''}
                    ${item.victory ? '<p style="color:#10b981;"><b>🏆 Победа:</b> ' + item.victory + '</p>' : ''}
                    ${item.lesson ? '<p><b>💡 Урок:</b> ' + item.lesson + '</p>' : ''}
                `;
                container.appendChild(card);
            });
        }

        function exportData() {
            const profile = JSON.parse(localStorage.getItem('user_profile_dossier')) || {};
            const avatar = localStorage.getItem('user_avatar_img') || '';
            const backupPayload = {
                db: db,
                profile: profile,
                avatar: avatar
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupPayload, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `daily_backup_${todayKey}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function resetData() {
            if (confirm("Точно очистить всю историю, досье и статистику?")) {
                localStorage.removeItem('daily_goals_db');
                localStorage.removeItem('user_profile_dossier');
                localStorage.removeItem('user_avatar_img');
                db = [];
                clearTodayForm();
                init();
                showToast("🗑 Вся база и досье очищены!");
            }
        }

        window.onload = init;
    </script>
</body>
</html>
