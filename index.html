<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Трекер Целей & Аналитика</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(22, 30, 46, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --accent-pink: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.12);
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px 100px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo-area h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-area p {
            color: #38bdf8;
            font-size: 13px;
            margin-top: 4px;
            font-weight: 600;
        }

        /* NAVIGATION MENU */
        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 6px;
            border-radius: 16px;
            margin-bottom: 24px;
            position: sticky;
            top: 16px;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .nav-item.active {
            background: linear-gradient(135deg, var(--accent-primary), #4f46e5);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }

        /* CARD TODAY */
        .today-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 25px var(--accent-glow);
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .today-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .today-badge {
            background: #10b981;
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }

        .energy-input {
            width: 60px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: #fbbf24;
            font-weight: 800;
            text-align: center;
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 16px;
        }

        .field-group {
            margin-bottom: 16px;
        }

        .field-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .field-group textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            color: #fff;
            padding: 12px;
            font-size: 14px;
            resize: vertical;
            min-height: 55px;
            outline: none;
        }

        .btn-save {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            color: #fff;
            font-weight: 800;
            font-size: 16px;
            padding: 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-save:active {
            transform: scale(0.98);
        }

        /* STATS & HISTORY */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 800;
            color: #a5b4fc;
        }

        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .chart-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chart-box h2 {
            font-size: 15px;
            margin-bottom: 16px;
            color: #a5b4fc;
            width: 100%;
        }

        .donut-wrapper {
            position: relative;
            width: 100%;
            max-width: 240px;
            height: 240px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .history-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 16px;
        }

        .history-date {
            font-weight: 800;
            color: #a5b4fc;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .btn-action {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 8px 12px;
            border-radius: var(--radius-md);
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-area">
                <h1>⚡ Цели & Осознанность</h1>
                <p id="today-date-display">📅 Сегодня: --.--.----</p>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="btn-action" onclick="exportData()">💾 Бэкап</button>
                <button class="btn-action" onclick="resetData()" style="color: #f87171;">🗑</button>
            </div>
        </header>

        <!-- MENU -->
        <nav class="nav-menu">
            <button class="nav-item active" onclick="openSection('today', this)">🔥 Сегодня</button>
            <button class="nav-item" onclick="openSection('stats', this)">📈 Статистика</button>
            <button class="nav-item" onclick="openSection('history', this)">📚 История</button>
        </nav>

        <!-- SECTION 1: ТОЛЬКО СЕГОДНЯ -->
        <section id="sec-today" class="page-section active">
            <div class="today-card">
                <div class="today-card-header">
                    <span class="today-badge">🎯 Карточка Дня</span>
                    <div>
                        <label style="font-size: 11px; color: var(--text-muted);">⚡ Энергия: </label>
                        <input type="number" min="1" max="10" id="today-energy" class="energy-input" placeholder="1-10">
                    </div>
                </div>

                <div class="field-group">
                    <label>🎯 Главная цель дня</label>
                    <textarea id="today-goal" placeholder="Какую главную цель закрываем сегодня?"></textarea>
                </div>
                <div class="field-group">
                    <label>🚫 Отказ дня</label>
                    <textarea id="today-refusal" placeholder="Чему сказал «нет»..."></textarea>
                </div>
                <div class="field-group">
                    <label>💡 Главный урок / Инсайт</label>
                    <textarea id="today-lesson" placeholder="Что понял за сегодня..."></textarea>
                </div>
                <div class="field-group">
                    <label>🔥 Слово дня</label>
                    <textarea id="today-word" placeholder="Девиз или мысль дня..."></textarea>
                </div>

                <button class="btn-save" onclick="saveToday()">Сохранить день и отправить в статистику ✅</button>
            </div>
        </section>

        <!-- SECTION 2: СТАТИСТИКА -->
        <section id="sec-stats" class="page-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Всего дней</h3>
                    <div class="value" id="stat-total-days">0</div>
                </div>
                <div class="stat-card">
                    <h3>Средняя энергия</h3>
                    <div class="value" id="stat-avg-energy">0.0</div>
                </div>
            </div>

            <div class="charts-container">
                <div class="chart-box">
                    <h2>🍩 Распределение энергии</h2>
                    <div class="donut-wrapper">
                        <canvas id="energyCategoryDonutChart"></canvas>
                    </div>
                </div>
                <div class="chart-box" style="justify-content: center;">
                    <h2>📈 Динамика энергии</h2>
                    <canvas id="energyChart" height="180"></canvas>
                </div>
            </div>
        </section>

        <!-- SECTION 3: ИСТОРИЯ -->
        <section id="sec-history" class="page-section">
            <div id="history-container" class="history-list"></div>
        </section>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('daily_goals_db')) || [];

        const todayKey = new Date().toISOString().slice(0, 10); // Формат YYYY-MM-DD
        const formattedDate = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

        let energyChartInstance = null;
        let energyCategoryDonutInstance = null;

        function init() {
            document.getElementById('today-date-display').innerText = `📅 Сегодня: ${formattedDate}`;
            loadTodayData();
        }

        function loadTodayData() {
            const todayRecord = db.find(item => item.date === todayKey);
            if (todayRecord) {
                document.getElementById('today-energy').value = todayRecord.energy || '';
                document.getElementById('today-goal').value = todayRecord.goal || '';
                document.getElementById('today-refusal').value = todayRecord.refusal || '';
                document.getElementById('today-lesson').value = todayRecord.lesson || '';
                document.getElementById('today-word').value = todayRecord.word || '';
            }
        }

        function saveToday() {
            const energy = document.getElementById('today-energy').value;
            const goal = document.getElementById('today-goal').value;
            const refusal = document.getElementById('today-refusal').value;
            const lesson = document.getElementById('today-lesson').value;
            const word = document.getElementById('today-word').value;

            const existingIndex = db.findIndex(item => item.date === todayKey);

            const record = {
                date: todayKey,
                formattedDate: formattedDate,
                energy: energy,
                goal: goal,
                refusal: refusal,
                lesson: lesson,
                word: word
            };

            if (existingIndex >= 0) {
                db[existingIndex] = record;
            } else {
                db.push(record);
            }

            localStorage.setItem('daily_goals_db', JSON.stringify(db));
            alert('День успешно сохранён и улетел в статистику! 🚀');
        }

        function openSection(secName, btn) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

            document.getElementById(`sec-${secName}`).classList.add('active');
            btn.classList.add('active');

            if (secName === 'stats') renderStats();
            if (secName === 'history') renderHistory();
        }

        function renderStats() {
            document.getElementById('stat-total-days').innerText = db.length;

            let totalEnergy = 0;
            let energyCount = 0;
            let high = 0, med = 0, low = 0;

            const labels = [];
            const energyValues = [];

            // Сортируем по дате для красивого графика
            const sortedDb = [...db].sort((a, b) => new Date(a.date) - new Date(b.date));

            sortedDb.forEach(item => {
                labels.push(item.formattedDate.split(' ')[0] + ' ' + item.formattedDate.split(' ')[1]);
                if (item.energy) {
                    const e = parseFloat(item.energy);
                    totalEnergy += e;
                    energyCount++;
                    energyValues.push(e);

                    if (e >= 8) high++;
                    else if (e >= 5) med++;
                    else if (e >= 1) low++;
                } else {
                    energyValues.push(null);
                }
            });

            document.getElementById('stat-avg-energy').innerText = energyCount > 0 ? (totalEnergy / energyCount).toFixed(1) : '0.0';

            // 1. Круговой график
            const ctxDonut = document.getElementById('energyCategoryDonutChart').getContext('2d');
            if (energyCategoryDonutInstance) energyCategoryDonutInstance.destroy();
            energyCategoryDonutInstance = new Chart(ctxDonut, {
                type: 'doughnut',
                data: {
                    labels: ['Высокая (8-10)', 'Средняя (5-7)', 'Низкая (1-4)'],
                    datasets: [{
                        data: [high, med, low],
                        backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#f8fafc' } } }
                }
            });

            // 2. Линейный график
            const ctxLine = document.getElementById('energyChart').getContext('2d');
            if (energyChartInstance) energyChartInstance.destroy();
            energyChartInstance = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Энергия',
                        data: energyValues,
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.2)',
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#ec4899'
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { min: 0, max: 10, ticks: { color: '#94a3b8' } },
                        x: { ticks: { color: '#94a3b8' } }
                    },
                    plugins: { legend: { labels: { color: '#f8fafc' } } }
                }
            });
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            container.innerHTML = '';

            if (db.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">История пока пуста. Заполни свой первый день!</p>';
                return;
            }

            const sortedDb = [...db].sort((a, b) => new Date(b.date) - new Date(a.date));

            sortedDb.forEach(item => {
                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div class="history-date">📅 ${item.formattedDate} ${item.energy ? ' (⚡ Энергия: ' + item.energy + ')' : ''}</div>
                    ${item.goal ? '<p style="font-size:13px; margin-bottom:4px;"><b>🎯 Цель:</b> ' + item.goal + '</p>' : ''}
                    ${item.refusal ? '<p style="font-size:13px; margin-bottom:4px;"><b>🚫 Отказ:</b> ' + item.refusal + '</p>' : ''}
                    ${item.lesson ? '<p style="font-size:13px; margin-bottom:4px;"><b>💡 Урок:</b> ' + item.lesson + '</p>' : ''}
                    ${item.word ? '<p style="font-size:13px;"><b>🔥 Слово:</b> ' + item.word + '</p>' : ''}
                `;
                container.appendChild(card);
            });
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `goals_backup_${todayKey}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function resetData() {
            if (confirm("Точно очистить всю историю и статистику?")) {
                localStorage.removeItem('daily_goals_db');
                db = [];
                init();
                alert('Всё очищено!');
            }
        }

        window.onload = init;
    </script>
</body>
</html>
