<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Дневник Осознанности & Аналитика</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(22, 30, 46, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --accent-pink: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.12);
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px 100px; /* Запас снизу под мобильное меню */
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .logo-area h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-area p {
            color: #38bdf8;
            font-size: 13px;
            margin-top: 4px;
            font-weight: 600;
        }

        .user-meta-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .meta-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-group label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .meta-group input {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            color: #fff;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
        }

        /* NAVIGATION MENU (СНОСКИ / ВКЛАДКИ) */
        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 6px;
            border-radius: 16px;
            margin-bottom: 24px;
            position: sticky;
            top: 16px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-item {
            flex: 1;
            max-width: 200px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .nav-item:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            background: linear-gradient(135deg, var(--accent-primary), #4f46e5);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        /* SECTION MANAGERS */
        .page-section {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .page-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CARDS VIEW */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .day-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
        }

        .day-card.today-card {
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .day-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .day-badge {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-pink));
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .today-badge {
            background: #10b981 !important;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        .energy-input {
            width: 55px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: #fbbf24;
            font-weight: 800;
            text-align: center;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 14px;
        }

        .field-group {
            margin-bottom: 14px;
        }

        .field-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .field-group textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            color: #fff;
            padding: 10px 12px;
            font-size: 13px;
            resize: vertical;
            min-height: 48px;
            outline: none;
        }

        /* STATS SECTION */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 800;
            color: #a5b4fc;
        }

        .chart-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        /* NOTES SECTION */
        .notes-area {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .notes-area textarea {
            width: 100%;
            height: 400px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            color: #fff;
            padding: 16px;
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            resize: vertical;
        }

        .btn-action {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        @media (max-width: 640px) {
            header { flex-direction: column; align-items: flex-start; }
            .user-meta-controls { width: 100%; flex-direction: column; }
            .meta-group { width: 100%; }
            .days-grid { grid-template-columns: 1fr; }
            .nav-item { font-size: 12px; padding: 10px 8px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="logo-area">
                <h1>⚡ Осознанность & Аналитика</h1>
                <p id="today-date-display">📅 Сегодня: --.--.----</p>
            </div>

            <div class="user-meta-controls">
                <div class="meta-group">
                    <label>👤 Владелец (ФИО)</label>
                    <input type="text" id="user-fullname" placeholder="Имя и Фамилия" oninput="saveData()">
                </div>
                <div class="meta-group">
                    <label>📅 Период</label>
                    <input type="text" id="meta-month" value="Август 2026" oninput="saveData()">
                </div>
                <div style="display: flex; gap: 8px; align-self: flex-end;">
                    <button class="btn-action" onclick="exportData()">💾 Бэкап</button>
                    <button class="btn-action" onclick="resetData()" style="color: #f87171;">🗑</button>
                </div>
            </div>
        </header>

        <!-- MAIN MENU (СНОСКИ) -->
        <nav class="nav-menu">
            <button class="nav-item active" onclick="openSection('journal', this)">📖 Дневник</button>
            <button class="nav-item" onclick="openSection('stats', this)">📈 Статистика</button>
            <button class="nav-item" onclick="openSection('notes', this)">📝 Заметки</button>
        </nav>

        <!-- SECTION 1: ДНЕВНИК -->
        <section id="sec-journal" class="page-section active">
            <div id="grid-view" class="days-grid"></div>
        </section>

        <!-- SECTION 2: СТАТИСТИКА -->
        <section id="sec-stats" class="page-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Заполнено дней</h3>
                    <div class="value" id="stat-filled-days">0 / 31</div>
                </div>
                <div class="stat-card">
                    <h3>Средняя энергия</h3>
                    <div class="value" id="stat-avg-energy">0.0</div>
                </div>
                <div class="stat-card">
                    <h3>Прогресс месяца</h3>
                    <div class="value" id="stat-progress">0%</div>
                </div>
            </div>

            <div class="chart-box">
                <h2 style="font-size: 16px; margin-bottom: 16px; color: #a5b4fc;">📈 Динамика уровня энергии</h2>
                <canvas id="energyChart" height="100"></canvas>
            </div>
        </section>

        <!-- SECTION 3: ЗАМЕТКИ -->
        <section id="sec-notes" class="page-section">
            <div class="notes-area">
                <h2 style="font-size: 16px; margin-bottom: 12px; color: #a5b4fc;">📝 Пространство свободного ввода / Мысли недели</h2>
                <textarea id="free-notes" placeholder="Записывай сюда инсайты, важные задачи, цели на месяц или свободные размышления..." oninput="saveData()"></textarea>
            </div>
        </section>
    </div>

    <script>
        const TOTAL_DAYS = 31;
        let journalData = {};
        let energyChartInstance = null;

        const now = new Date();
        const currentDayNum = now.getDate();
        const formattedDate = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

        function initData() {
            document.getElementById('today-date-display').innerText = `📅 Сегодня: ${formattedDate}`;

            const saved = localStorage.getItem('reflection_journal_db');
            if (saved) {
                try { journalData = JSON.parse(saved); } catch(e) { journalData = {}; }
            }
            
            if (journalData.userFullname) document.getElementById('user-fullname').value = journalData.userFullname;
            if (journalData.metaMonth) document.getElementById('meta-month').value = journalData.metaMonth;
            if (journalData.freeNotes) document.getElementById('free-notes').value = journalData.freeNotes;

            renderGrid();
        }

        function openSection(secName, btn) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

            document.getElementById(`sec-${secName}`).classList.add('active');
            btn.classList.add('active');

            if (secName === 'stats') {
                renderAnalytics();
            }
        }

        function saveData() {
            journalData.userFullname = document.getElementById('user-fullname').value;
            journalData.metaMonth = document.getElementById('meta-month').value;
            journalData.freeNotes = document.getElementById('free-notes').value;

            for (let i = 1; i <= TOTAL_DAYS; i++) {
                const dayKey = `day_${i}`;
                if (!journalData[dayKey]) journalData[dayKey] = {};

                const energyCard = document.getElementById(`energy-card-${i}`);
                if (energyCard) {
                    journalData[dayKey].energy = energyCard.value;
                    journalData[dayKey].refusal = document.getElementById(`refusal-card-${i}`).value;
                    journalData[dayKey].lesson = document.getElementById(`lesson-card-${i}`).value;
                    journalData[dayKey].word = document.getElementById(`word-card-${i}`).value;
                    journalData[dayKey].self = document.getElementById(`self-card-${i}`).value;
                }
            }
            localStorage.setItem('reflection_journal_db', JSON.stringify(journalData));
        }

        function renderGrid() {
            const grid = document.getElementById('grid-view');
            grid.innerHTML = '';

            for (let i = TOTAL_DAYS; i >= 1; i--) {
                const dayKey = `day_${i}`;
                const data = journalData[dayKey] || {};
                const isToday = (i === currentDayNum);

                const card = document.createElement('div');
                card.className = `day-card ${isToday ? 'today-card' : ''}`;
                card.innerHTML = `
                    <div class="day-card-header">
                        <span class="day-badge ${isToday ? 'today-badge' : ''}">${isToday ? '🔥 Сегодня (День ' + i + ')' : 'День ' + i}</span>
                        <div class="energy-selector">
                            <label style="font-size: 11px; color: var(--text-muted);">⚡ Энергия</label>
                            <input type="number" min="1" max="10" id="energy-card-${i}" class="energy-input" value="${data.energy || ''}" placeholder="1-10" oninput="saveData()">
                        </div>
                    </div>
                    <div class="field-group">
                        <label>🚫 Отказ дня</label>
                        <textarea id="refusal-card-${i}" placeholder="Чему сказал «нет»..." oninput="saveData()">${data.refusal || ''}</textarea>
                    </div>
                    <div class="field-group">
                        <label>💡 Ошибка → Урок</label>
                        <textarea id="lesson-card-${i}" placeholder="Что понял..." oninput="saveData()">${data.lesson || ''}</textarea>
                    </div>
                    <div class="field-group">
                        <label>🔥 Моё слово</label>
                        <textarea id="word-card-${i}" placeholder="Фраза дня..." oninput="saveData()">${data.word || ''}</textarea>
                    </div>
                    <div class="field-group">
                        <label>🎭 Где был не собой?</label>
                        <textarea id="self-card-${i}" placeholder="Осознанность..." oninput="saveData()">${data.self || ''}</textarea>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        function renderAnalytics() {
            const labels = [];
            const energyValues = [];
            let filledDays = 0;
            let totalEnergy = 0;
            let energyCount = 0;

            for (let i = 1; i <= TOTAL_DAYS; i++) {
                labels.push(`День ${i}`);
                const dayData = journalData[`day_${i}`];
                
                if (dayData && (dayData.refusal || dayData.lesson || dayData.word || dayData.self || dayData.energy)) {
                    filledDays++;
                }

                if (dayData && dayData.energy) {
                    const energyNum = parseFloat(dayData.energy);
                    energyValues.push(energyNum);
                    totalEnergy += energyNum;
                    energyCount++;
                } else {
                    energyValues.push(null);
                }
            }

            document.getElementById('stat-filled-days').innerText = `${filledDays} / ${TOTAL_DAYS}`;
            document.getElementById('stat-avg-energy').innerText = energyCount > 0 ? (totalEnergy / energyCount).toFixed(1) : '0.0';
            document.getElementById('stat-progress').innerText = `${Math.round((filledDays / TOTAL_DAYS) * 100)}%`;

            const ctx = document.getElementById('energyChart').getContext('2d');
            
            if (energyChartInstance) {
                energyChartInstance.destroy();
            }

            energyChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Уровень энергии (1-10)',
                        data: energyValues,
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.2)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#ec4899',
                        pointRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            min: 0,
                            max: 10,
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#94a3b8' }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: { color: '#f8fafc' }
                        }
                    }
                }
            });
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(journalData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `journal_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function resetData() {
            if (confirm("Вы уверены, что хотите очистить весь дневник? Все записи будут удалены.")) {
                localStorage.removeItem('reflection_journal_db');
                journalData = {};
                initData();
            }
        }

        window.onload = initData;
    </script>
</body>
</html>
