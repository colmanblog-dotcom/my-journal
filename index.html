<!DOCTYPE html>
<html lang="ru" data-theme="cyber">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Executive Daily Hub v3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ==================== ROOT VARIABLES ==================== */
        :root {
            --bg: #090d16;
            --card-bg: rgba(22, 30, 46, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.12);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 16px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        :root[data-theme="oled"] {
            --bg: #000000;
            --card-bg: #0d0d0d;
            --card-border: rgba(255, 255, 255, 0.15);
            --accent-primary: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --text-main: #ffffff;
            --text-muted: #71717a;
            --input-bg: #18181b;
            --input-border: #27272a;
        }

        :root[data-theme="gold"] {
            --bg: #0f0e0c;
            --card-bg: rgba(28, 25, 23, 0.95);
            --card-border: rgba(217, 119, 6, 0.25);
            --accent-primary: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.3);
            --text-main: #fef3c7;
            --text-muted: #a1a1aa;
            --input-bg: rgba(44, 36, 22, 0.6);
            --input-border: rgba(217, 119, 6, 0.3);
        }

        /* ==================== RESET & BASE ==================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px 100px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        /* ==================== PIN LOCK ==================== */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(20px);
        }

        .pin-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px;
            text-align: center;
            box-shadow: var(--shadow);
            max-width: 340px;
            width: 100%;
        }

        .pin-box h2 {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .pin-box p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .pin-input {
            width: 100%;
            font-size: 28px;
            text-align: center;
            letter-spacing: 12px;
            padding: 12px;
            margin: 12px 0 20px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.3s;
        }

        .pin-input:focus {
            border-color: var(--accent-primary);
        }

        /* ==================== TOAST ==================== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--card-bg);
            border: 1px solid var(--accent-primary);
            box-shadow: 0 8px 25px var(--accent-glow);
            color: var(--text-main);
            padding: 14px 24px;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 14px;
            z-index: 1000;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(12px);
            max-width: 90%;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        .toast.warning { border-color: var(--warning); }

        /* ==================== COMPACT HEADER ==================== */
        header {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* COMPACT DOSSIER - НОВЫЙ КОМПАКТНЫЙ ДИЗАЙН */
        .dossier-compact {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dossier-avatar-small {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 15px var(--accent-glow);
            overflow: hidden;
            flex-shrink: 0;
            background: var(--input-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .dossier-avatar-small:hover {
            transform: scale(1.05);
        }

        .dossier-avatar-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dossier-avatar-small .upload-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 18px;
            border-radius: 14px;
        }

        .dossier-avatar-small:hover .upload-overlay {
            opacity: 1;
        }

        .dossier-info {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            align-items: center;
        }

        .dossier-info .name-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }

        .dossier-info .name-group input {
            background: transparent;
            border: none;
            border-bottom: 1px dashed var(--card-border);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            padding: 2px 4px;
            min-width: 60px;
            max-width: 120px;
            outline: none;
            transition: border-color 0.3s;
        }

        .dossier-info .name-group input:focus {
            border-bottom-color: var(--accent-primary);
        }

        .dossier-info .name-group input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 12px;
        }

        .dossier-info .meta-group {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .dossier-info .meta-group input {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            color: var(--text-main);
            padding: 2px 8px;
            font-size: 12px;
            width: 70px;
            outline: none;
            transition: border-color 0.3s;
        }

        .dossier-info .meta-group input:focus {
            border-color: var(--accent-primary);
        }

        .dossier-info .meta-group input::placeholder {
            color: var(--text-muted);
            font-size: 10px;
        }

        .dossier-info .meta-group .separator {
            color: var(--text-muted);
            font-size: 12px;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--card-border);
        }

        .header-controls .left-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-controls .right-group {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .streak-badge {
            background: linear-gradient(135deg, var(--warning), var(--danger));
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        .theme-selector {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            outline: none;
            cursor: pointer;
        }

        .btn-action {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-action:hover {
            border-color: var(--text-muted);
        }

        .btn-action.danger:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .date-display {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ==================== NAVIGATION ==================== */
        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 8px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 6px;
            border-radius: var(--radius);
            margin-bottom: 24px;
            position: sticky;
            top: 16px;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .nav-item.active {
            background: var(--accent-primary);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .nav-item:hover:not(.active) {
            background: var(--input-bg);
        }

        /* ==================== SECTIONS ==================== */
        .page-section { display: none; }
        .page-section.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==================== TODAY CARD ==================== */
        .today-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 30px var(--accent-glow);
            border-radius: var(--radius);
            padding: 24px;
        }

        .today-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
        }

        .section-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--accent-primary);
            margin: 20px 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-left: 3px solid var(--accent-primary);
            padding-left: 10px;
        }

        .field-group { margin-bottom: 16px; }
        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .field-group label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

        .btn-mic {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--accent-primary);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-mic:hover {
            background: var(--accent-primary);
            color: #fff;
        }

        .btn-mic.recording {
            background: var(--danger) !important;
            color: #fff !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .field-group textarea,
        .field-group input[type="text"],
        .field-group select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-main);
            padding: 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .field-group textarea:focus,
        .field-group input[type="text"]:focus {
            border-color: var(--accent-primary);
        }

        .field-group textarea { resize: vertical; min-height: 55px; }

        .energy-range {
            width: 100%;
            height: 8px;
            background: var(--input-bg);
            border-radius: 12px;
            outline: none;
            accent-color: var(--accent-primary);
            cursor: pointer;
            margin-top: 8px;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 500px) { .grid-2 { grid-template-columns: 1fr; } }

        .btn-save {
            width: 100%;
            background: linear-gradient(135deg, var(--success), #059669);
            border: none;
            color: #fff;
            font-weight: 800;
            font-size: 16px;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            margin-top: 20px;
            transition: all 0.3s;
            position: relative;
        }

        .btn-save:hover { transform: scale(1.01); }
        .btn-save:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* ==================== STATS ==================== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent-primary);
        }

        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .chart-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chart-box h2 {
            font-size: 14px;
            margin-bottom: 12px;
            color: var(--accent-primary);
            width: 100%;
        }

        .donut-wrapper {
            position: relative;
            width: 100%;
            max-width: 200px;
            height: 200px;
        }

        /* ==================== SUBTABS ==================== */
        .subtabs-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }

        .subtabs-nav::-webkit-scrollbar { display: none; }

        .subtab-btn {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .subtab-btn.active {
            background: var(--accent-primary);
            color: #fff;
            border-color: var(--accent-primary);
        }

        .subtab-btn:hover:not(.active) {
            border-color: var(--text-muted);
        }

        /* ==================== LISTS ==================== */
        .archive-list,
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .archive-item,
        .history-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.5;
        }

        .archive-item-date,
        .history-date {
            font-size: 11px;
            color: var(--accent-primary);
            font-weight: 800;
            margin-bottom: 4px;
        }

        .search-box {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-main);
            padding: 8px 14px;
            font-size: 13px;
            outline: none;
            margin-bottom: 16px;
            transition: border-color 0.3s;
        }

        .search-box:focus {
            border-color: var(--accent-primary);
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 580px) {
            .dossier-compact {
                flex-wrap: wrap;
            }
            .dossier-info .name-group input {
                max-width: 80px;
                font-size: 13px;
            }
            .dossier-info .meta-group input {
                width: 60px;
            }
            .header-controls {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .header-controls .left-group,
            .header-controls .right-group {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .today-card { padding: 16px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .chart-box { padding: 12px; }
            .donut-wrapper { max-width: 160px; height: 160px; }
        }
    </style>
</head>
<body>

    <!-- ==================== PIN LOCK ==================== -->
    <div id="lock-screen" style="display: none;">
        <div class="pin-box">
            <h2>🔒 Вход по PIN</h2>
            <p>Введите ваш 4-значный код доступа</p>
            <input type="password" id="pin-input" class="pin-input" maxlength="4" placeholder="••••" autofocus>
            <button class="btn-save" style="margin-top:0; padding:12px;" onclick="checkPin()">Войти</button>
        </div>
    </div>

    <!-- ==================== TOAST ==================== -->
    <div id="toast" class="toast"></div>

    <!-- ==================== MAIN APP ==================== -->
    <div class="container">

        <!-- ===== COMPACT HEADER ===== -->
        <header>
            <!-- COMPACT DOSSIER -->
            <div class="dossier-compact">
                <div class="dossier-avatar-small" id="avatar-container" onclick="document.getElementById('avatar-input').click()">
                    👤
                    <div class="upload-overlay">📷</div>
                    <input type="file" id="avatar-input" accept="image/*" style="display: none;" onchange="uploadAvatar(this)">
                </div>

                <div class="dossier-info">
                    <div class="name-group">
                        <input type="text" id="user-lastname" placeholder="Фамилия" onchange="ProfileManager.save()">
                        <input type="text" id="user-firstname" placeholder="Имя" onchange="ProfileManager.save()">
                        <input type="text" id="user-middlename" placeholder="Отчество" onchange="ProfileManager.save()">
                    </div>
                    <div class="meta-group">
                        <input type="text" id="user-city" placeholder="Город" onchange="ProfileManager.save()">
                        <span class="separator">•</span>
                        <input type="text" id="user-age" placeholder="Возраст" onchange="ProfileManager.save()">
                    </div>
                </div>
            </div>

            <!-- CONTROLS -->
            <div class="header-controls">
                <div class="left-group">
                    <span class="date-display" id="today-date-display">📅 Сегодня: --.--.----</span>
                    <div class="streak-badge">🔥 <span id="streak-count">0</span> дн.</div>
                </div>
                <div class="right-group">
                    <select class="theme-selector" onchange="ThemeManager.change(this.value)" id="theme-select">
                        <option value="cyber">🌌 Cyber</option>
                        <option value="oled">🖤 OLED</option>
                        <option value="gold">👑 Gold</option>
                    </select>
                    <button class="btn-action" onclick="BackupManager.export()">💾</button>
                    <button class="btn-action danger" onclick="BackupManager.reset()">🗑</button>
                </div>
            </div>
        </header>

        <!-- NAVIGATION -->
        <nav class="nav-menu">
            <button class="nav-item active" onclick="UI.openSection('today', this)">🔥 Сегодня</button>
            <button class="nav-item" onclick="UI.openSection('stats', this)">📈 Статистика</button>
            <button class="nav-item" onclick="UI.openSection('history', this)">📚 История</button>
        </nav>

        <!-- SECTION: TODAY -->
        <section id="sec-today" class="page-section active">
            <div class="today-card">
                <div class="today-card-header">
                    <span style="background: var(--accent-primary); color:#fff; font-weight:800; font-size:12px; padding:4px 14px; border-radius:20px;">🎯 Карточка Дня</span>
                    <span id="today-status" style="font-size:12px; color:var(--text-muted);"></span>
                </div>

                <div class="section-title">⚡ Состояние и Дисциплина</div>
                <div class="grid-2">
                    <div class="field-group">
                        <div class="label-row">
                            <label>⚡ Энергия: <span id="energy-val" style="color:var(--accent-primary); font-weight:800;">5</span>/10</label>
                        </div>
                        <input type="range" min="1" max="10" value="5" id="today-energy" class="energy-range" oninput="document.getElementById('energy-val').innerText = this.value">
                    </div>
                    <div class="field-group">
                        <label>🏃 Спорт / Активность</label>
                        <select id="today-sport">
                            <option value="Нет">❌ Без активности</option>
                            <option value="Легкая">🚶 Прогулка / Зарядка</option>
                            <option value="Тренировка">🏋️ Полноценная тренировка</option>
                            <option value="Кардио">🚴 Кардио / Бег / Вел</option>
                        </select>
                    </div>
                </div>

                <div class="section-title">🎯 Главный Фокус Дня</div>
                <div class="field-group">
                    <div class="label-row">
                        <label>🎯 Главная цель / Задача дня</label>
                        <button class="btn-mic" onclick="VoiceInput.start('today-goal', this)">🎤</button>
                    </div>
                    <textarea id="today-goal" placeholder="Какую главную цель закрываем сегодня?"></textarea>
                </div>

                <div class="field-group">
                    <div class="label-row">
                        <label>📌 Второстепенные задачи</label>
                        <button class="btn-mic" onclick="VoiceInput.start('today-subgoals', this)">🎤</button>
                    </div>
                    <input type="text" id="today-subgoals" placeholder="Например: отправить письмо, купить продукты...">
                </div>

                <div class="section-title">🧠 Итоги & Осознанность</div>

                <div class="field-group">
                    <div class="label-row">
                        <label>🏆 Главная победа дня</label>
                        <button class="btn-mic" onclick="VoiceInput.start('today-victory', this)">🎤</button>
                    </div>
                    <textarea id="today-victory" placeholder="Что сегодня получилось лучше всего?"></textarea>
                </div>

                <div class="field-group">
                    <div class="label-row">
                        <label>❤️ За что благодарен сегодня</label>
                        <button class="btn-mic" onclick="VoiceInput.start('today-thanks', this)">🎤</button>
                    </div>
                    <textarea id="today-thanks" placeholder="Кому или чему благодарен..."></textarea>
                </div>

                <div class="field-group">
                    <div class="label-row">
                        <label>🚫 Отказ дня</label>
                        <button class="btn-mic" onclick="VoiceInput.start('today-refusal', this)">🎤</button>
                    </div>
                    <textarea id="today-refusal" placeholder="Чему или кому сказал «нет»..."></textarea>
                </div>

                <div class="grid-2">
                    <div class="field-group">
                        <div class="label-row">
                            <label>💡 Главный урок</label>
                            <button class="btn-mic" onclick="VoiceInput.start('today-lesson', this)">🎤</button>
                        </div>
                        <textarea id="today-lesson" placeholder="Что понял за день..."></textarea>
                    </div>
                    <div class="field-group">
                        <div class="label-row">
                            <label>🔥 Слово дня</label>
                            <button class="btn-mic" onclick="VoiceInput.start('today-word', this)">🎤</button>
                        </div>
                        <textarea id="today-word" placeholder="Девиз дня..."></textarea>
                    </div>
                </div>

                <button class="btn-save" id="save-btn" onclick="DayManager.save()">Сохранить день ✅</button>
            </div>
        </section>

        <!-- SECTION: STATS -->
        <section id="sec-stats" class="page-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Всего дней</h3>
                    <div class="value" id="stat-total-days">0</div>
                </div>
                <div class="stat-card">
                    <h3>Средняя энергия</h3>
                    <div class="value" id="stat-avg-energy">0.0</div>
                </div>
                <div class="stat-card">
                    <h3>Закрыто целей</h3>
                    <div class="value" id="stat-goals-count">0</div>
                </div>
            </div>

            <div class="charts-container">
                <div class="chart-box">
                    <h2>🍩 Распределение энергии</h2>
                    <div class="donut-wrapper">
                        <canvas id="energyCategoryDonutChart"></canvas>
                    </div>
                </div>
                <div class="chart-box">
                    <h2>📈 Динамика энергии</h2>
                    <canvas id="energyChart" height="180"></canvas>
                </div>
            </div>

            <div class="section-title">📊 Архив записей</div>

            <div class="subtabs-nav">
                <button class="subtab-btn active" onclick="ArchiveManager.switchTab('goals', this)">🎯 Цели</button>
                <button class="subtab-btn" onclick="ArchiveManager.switchTab('victories', this)">🏆 Победы</button>
                <button class="subtab-btn" onclick="ArchiveManager.switchTab('refusals', this)">🚫 Отказы</button>
                <button class="subtab-btn" onclick="ArchiveManager.switchTab('lessons', this)">💡 Уроки</button>
                <button class="subtab-btn" onclick="ArchiveManager.switchTab('thanks', this)">❤️ Благодарности</button>
            </div>

            <input type="text" id="archive-search" class="search-box" placeholder="🔍 Поиск по архиву..." oninput="ArchiveManager.filter(this.value)">

            <div id="archive-content-container" class="archive-list"></div>
        </section>

        <!-- SECTION: HISTORY -->
        <section id="sec-history" class="page-section">
            <div id="history-container" class="history-list"></div>
        </section>
    </div>

    <!-- ==================== JAVASCRIPT ==================== -->
    <script>
        // ===================================================================
        //  DATA STORE
        // ===================================================================
        const Store = {
            get key() { return 'daily_goals_db_v3'; },

            getAll() {
                try {
                    return JSON.parse(localStorage.getItem(this.key)) || [];
                } catch {
                    return [];
                }
            },

            save(data) {
                localStorage.setItem(this.key, JSON.stringify(data));
            },

            findToday() {
                const today = new Date().toISOString().slice(0, 10);
                return this.getAll().find(item => item.date === today) || null;
            },

            getStreak() {
                const entries = this.getAll();
                if (!entries.length) return 0;
                const dates = entries.map(i => i.date).sort().reverse();
                let streak = 0;
                let checkDate = new Date();

                for (let i = 0; i < dates.length; i++) {
                    const dateStr = checkDate.toISOString().slice(0, 10);
                    if (dates.includes(dateStr)) {
                        streak++;
                        checkDate.setDate(checkDate.getDate() - 1);
                    } else if (i === 0) {
                        checkDate.setDate(checkDate.getDate() - 1);
                        if (dates.includes(checkDate.toISOString().slice(0, 10))) {
                            streak++;
                            checkDate.setDate(checkDate.getDate() - 1);
                        } else break;
                    } else break;
                }
                return streak;
            }
        };

        // ===================================================================
        //  THEME MANAGER
        // ===================================================================
        const ThemeManager = {
            change(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('user_theme', theme);
                document.getElementById('theme-select').value = theme;
            },

            init() {
                const saved = localStorage.getItem('user_theme') || 'cyber';
                this.change(saved);
            }
        };

        // ===================================================================
        //  PROFILE MANAGER
        // ===================================================================
        const ProfileManager = {
            fields: ['lastname', 'firstname', 'middlename', 'city', 'age'],

            save() {
                const profile = {};
                this.fields.forEach(f => {
                    profile[f] = document.getElementById(`user-${f}`).value;
                });
                localStorage.setItem('user_profile_dossier', JSON.stringify(profile));
            },

            load() {
                const profile = JSON.parse(localStorage.getItem('user_profile_dossier')) || {};
                this.fields.forEach(f => {
                    document.getElementById(`user-${f}`).value = profile[f] || '';
                });

                const avatar = localStorage.getItem('user_avatar_img');
                if (avatar) {
                    document.getElementById('avatar-container').innerHTML =
                        `<img src="${avatar}" alt="Avatar"><div class="upload-overlay">📷</div>`;
                }
            },

            uploadAvatar(input) {
                if (!input.files || !input.files[0]) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result;
                    localStorage.setItem('user_avatar_img', base64);
                    document.getElementById('avatar-container').innerHTML =
                        `<img src="${base64}" alt="Avatar"><div class="upload-overlay">📷</div>`;
                    Toast.show('📷 Фото обновлено!', 'success');
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        // ===================================================================
        //  TOAST
        // ===================================================================
        const Toast = {
            show(msg, type = '') {
                const el = document.getElementById('toast');
                el.textContent = msg;
                el.className = 'toast ' + type;
                void el.offsetWidth;
                el.classList.add('show');
                clearTimeout(this._timeout);
                this._timeout = setTimeout(() => el.classList.remove('show'), 3000);
            }
        };

        // ===================================================================
        //  VOICE INPUT
        // ===================================================================
        const VoiceInput = {
            start(targetId, btn) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    Toast.show('❌ Браузер не поддерживает голосовой ввод', 'error');
                    return;
                }
                const recognition = new SpeechRecognition();
                recognition.lang = 'ru-RU';
                recognition.onstart = () => {
                    btn.classList.add('recording');
                    btn.innerHTML = '🔴';
                };
                recognition.onresult = (e) => {
                    const text = e.results[0][0].transcript;
                    const field = document.getElementById(targetId);
                    field.value = field.value ? field.value + ' ' + text : text;
                };
                recognition.onend = () => {
                    btn.classList.remove('recording');
                    btn.innerHTML = '🎤';
                };
                recognition.start();
            }
        };

        // ===================================================================
        //  DAY MANAGER
        // ===================================================================
        const DayManager = {
            get todayKey() { return new Date().toISOString().slice(0, 10); },

            get formattedDate() {
                return new Date().toLocaleDateString('ru-RU', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
            },

            load() {
                const record = Store.findToday();
                if (!record) return;

                document.getElementById('today-energy').value = record.energy || 5;
                document.getElementById('energy-val').innerText = record.energy || 5;
                document.getElementById('today-sport').value = record.sport || 'Нет';

                ['goal', 'subgoals', 'victory', 'thanks', 'refusal', 'lesson', 'word'].forEach(f => {
                    document.getElementById(`today-${f}`).value = record[f] || '';
                });

                document.getElementById('today-status').textContent = '✅ Сохранено';
                document.getElementById('today-status').style.color = 'var(--success)';
            },

            save() {
                const record = {
                    date: this.todayKey,
                    formattedDate: this.formattedDate,
                    energy: document.getElementById('today-energy').value,
                    sport: document.getElementById('today-sport').value,
                    goal: document.getElementById('today-goal').value.trim(),
                    subgoals: document.getElementById('today-subgoals').value.trim(),
                    victory: document.getElementById('today-victory').value.trim(),
                    thanks: document.getElementById('today-thanks').value.trim(),
                    refusal: document.getElementById('today-refusal').value.trim(),
                    lesson: document.getElementById('today-lesson').value.trim(),
                    word: document.getElementById('today-word').value.trim()
                };

                if (!record.goal) {
                    Toast.show('⚠️ Добавьте главную цель дня!', 'warning');
                    document.getElementById('today-goal').focus();
                    return;
                }

                const btn = document.getElementById('save-btn');
                btn.textContent = '⏳ ...';
                btn.disabled = true;

                const entries = Store.getAll();
                const existingIndex = entries.findIndex(item => item.date === this.todayKey);

                if (existingIndex >= 0) {
                    if (!confirm('📝 Сегодня уже сохранён. Перезаписать?')) {
                        btn.textContent = 'Сохранить день ✅';
                        btn.disabled = false;
                        return;
                    }
                    entries[existingIndex] = record;
                } else {
                    entries.push(record);
                }

                Store.save(entries);
                this._clearForm();
                document.getElementById('streak-count').textContent = Store.getStreak();
                document.getElementById('today-status').textContent = '✅ Сохранено';
                document.getElementById('today-status').style.color = 'var(--success)';

                Toast.show('🚀 День сохранён!', 'success');

                btn.textContent = '✅ Сохранено!';
                setTimeout(() => {
                    btn.textContent = 'Сохранить день ✅';
                    btn.disabled = false;
                }, 1500);
            },

            _clearForm() {
                document.getElementById('today-energy').value = 5;
                document.getElementById('energy-val').innerText = 5;
                document.getElementById('today-sport').value = 'Нет';
                ['goal', 'subgoals', 'victory', 'thanks', 'refusal', 'lesson', 'word'].forEach(f => {
                    document.getElementById(`today-${f}`).value = '';
                });
            }
        };

        // ===================================================================
        //  UI
        // ===================================================================
        const UI = {
            openSection(name, btn) {
                document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

                document.getElementById(`sec-${name}`).classList.add('active');
                btn.classList.add('active');

                if (name === 'stats') {
                    Stats.render();
                    const firstTab = document.querySelector('.subtab-btn');
                    if (firstTab) ArchiveManager.switchTab('goals', firstTab);
                }
                if (name === 'history') History.render();
            },

            updateDate() {
                const date = new Date().toLocaleDateString('ru-RU', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
                document.getElementById('today-date-display').textContent = `📅 Сегодня: ${date}`;
            },

            updateStreak() {
                document.getElementById('streak-count').textContent = Store.getStreak();
            }
        };

        // ===================================================================
        //  STATS
        // ===================================================================
        const Stats = {
            _energyChart: null,
            _donutChart: null,

            render() {
                const entries = Store.getAll();
                document.getElementById('stat-total-days').textContent = entries.length;

                let totalEnergy = 0,
                    energyCount = 0,
                    goalsCount = 0;
                let high = 0,
                    med = 0,
                    low = 0;
                const labels = [],
                    energyValues = [];
                const sorted = [...entries].sort((a, b) => new Date(a.date) - new Date(b.date));

                sorted.forEach(item => {
                    labels.push(item.formattedDate.split(' ')[0] + ' ' + item.formattedDate.split(' ')[1]);
                    if (item.goal) goalsCount++;
                    if (item.energy) {
                        const e = parseFloat(item.energy);
                        totalEnergy += e;
                        energyCount++;
                        energyValues.push(e);
                        if (e >= 8) high++;
                        else if (e >= 5) med++;
                        else if (e >= 1) low++;
                    }
                });

                document.getElementById('stat-avg-energy').textContent =
                    energyCount > 0 ? (totalEnergy / energyCount).toFixed(1) : '0.0';
                document.getElementById('stat-goals-count').textContent = goalsCount;

                const ctxDonut = document.getElementById('energyCategoryDonutChart').getContext('2d');
                if (this._donutChart) this._donutChart.destroy();
                this._donutChart = new Chart(ctxDonut, {
                    type: 'doughnut',
                    data: {
                        labels: ['Высокая (8-10)', 'Средняя (5-7)', 'Низкая (1-4)'],
                        datasets: [{
                            data: [high, med, low],
                            backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: { color: '#94a3b8', font: { size: 10 } }
                            }
                        }
                    }
                });

                const ctxLine = document.getElementById('energyChart').getContext('2d');
                if (this._energyChart) this._energyChart.destroy();
                this._energyChart = new Chart(ctxLine, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Энергия',
                            data: energyValues,
                            borderColor: '#6366f1',
                            backgroundColor: 'rgba(99, 102, 241, 0.15)',
                            fill: true,
                            tension: 0.3,
                            pointBackgroundColor: '#6366f1',
                            pointRadius: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: { min: 0, max: 10, ticks: { color: '#94a3b8', font: { size: 9 } } },
                            x: { ticks: { color: '#94a3b8', maxRotation: 45, font: { size: 8 } } }
                        },
                        plugins: {
                            legend: { labels: { color: '#94a3b8', font: { size: 10 } } }
                        }
                    }
                });
            }
        };

        // ===================================================================
        //  ARCHIVE MANAGER
        // ===================================================================
        const ArchiveManager = {
            _currentTab: 'goals',
            _entries: [],

            switchTab(tab, btn) {
                document.querySelectorAll('.subtab-btn').forEach(el => el.classList.remove('active'));
                if (btn) btn.classList.add('active');
                this._currentTab = tab;
                this._entries = Store.getAll().sort((a, b) => new Date(b.date) - new Date(a.date));
                this._render();
            },

            filter(query) {
                if (!query) {
                    this._render();
                    return;
                }
                const q = query.toLowerCase().trim();
                const container = document.getElementById('archive-content-container');
                const items = container.querySelectorAll('.archive-item');
                let visible = 0;
                items.forEach(el => {
                    const text = el.textContent.toLowerCase();
                    const match = text.includes(q);
                    el.style.display = match ? '' : 'none';
                    if (match) visible++;
                });
                if (visible === 0 && items.length > 0) {
                    const empty = container.querySelector('.empty-state') ||
                        document.createElement('p');
                    empty.className = 'empty-state';
                    empty.style.cssText =
                    'text-align:center;color:var(--text-muted);padding:20px;font-size:13px;';
                    empty.textContent = '🔍 Ничего не найдено';
                    if (!container.querySelector('.empty-state')) container.appendChild(empty);
                } else {
                    const empty = container.querySelector('.empty-state');
                    if (empty) empty.remove();
                }
            },

            _render() {
                const container = document.getElementById('archive-content-container');
                container.innerHTML = '';
                const tab = this._currentTab;
                const entries = this._entries;
                let count = 0;

                entries.forEach(item => {
                    let content = '';
                    if (tab === 'goals' && item.goal) {
                        content = item.goal + (item.subgoals ?
                            `<br><small style="color:var(--text-muted)">📌 ${item.subgoals}</small>` :
                            '');
                    }
                    if (tab === 'victories' && item.victory) content = item.victory;
                    if (tab === 'refusals' && item.refusal) content = item.refusal;
                    if (tab === 'lessons' && item.lesson) content = item.lesson;
                    if (tab === 'thanks' && item.thanks) content = item.thanks;

                    if (content) {
                        count++;
                        const el = document.createElement('div');
                        el.className = 'archive-item';
                        el.dataset.text = content.toLowerCase();
                        el.innerHTML =
                            `<div class="archive-item-date">📅 ${item.formattedDate}</div><div>${content}</div>`;
                        container.appendChild(el);
                    }
                });

                if (count === 0) {
                    container.innerHTML =
                        `<p style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px;">📭 Записей в этой категории пока нет</p>`;
                }
            }
        };

        // ===================================================================
        //  HISTORY
        // ===================================================================
        const History = {
            render() {
                const container = document.getElementById('history-container');
                container.innerHTML = '';
                const entries = Store.getAll().sort((a, b) => new Date(b.date) - new Date(a.date));

                if (!entries.length) {
                    container.innerHTML =
                        '<p style="text-align:center;color:var(--text-muted);padding:20px;">📭 История пуста</p>';
                    return;
                }

                entries.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'history-card';
                    let html = `<div class="history-date">📅 ${item.formattedDate}`;
                    if (item.energy) html += ` ⚡ ${item.energy}/10`;
                    html += '</div>';
                    if (item.goal) html += `<p><b>🎯 Цель:</b> ${item.goal}</p>`;
                    if (item.victory) html += `<p style="color:#10b981;"><b>🏆 Победа:</b> ${item.victory}</p>`;
                    if (item.lesson) html += `<p><b>💡 Урок:</b> ${item.lesson}</p>`;
                    if (item.word) html += `<p><b>🔥 Слово дня:</b> ${item.word}</p>`;
                    card.innerHTML = html;
                    container.appendChild(card);
                });
            }
        };

        // ===================================================================
        //  BACKUP MANAGER
        // ===================================================================
        const BackupManager = {
            export() {
                const profile = JSON.parse(localStorage.getItem('user_profile_dossier')) || {};
                const avatar = localStorage.getItem('user_avatar_img') || '';
                const theme = localStorage.getItem('user_theme') || 'cyber';
                const pin = localStorage.getItem('user_pin') || '';

                const payload = {
                    db: Store.getAll(),
                    profile: profile,
                    avatar: avatar,
                    theme: theme,
                    pin: pin,
                    exportedAt: new Date().toISOString()
                };

                const dataStr = "data:text/json;charset=utf-8," +
                    encodeURIComponent(JSON.stringify(payload, null, 2));
                const link = document.createElement('a');
                link.href = dataStr;
                link.download = `daily_backup_${DayManager.todayKey}.json`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                Toast.show('💾 Бэкап сохранён!', 'success');
            },

            reset() {
                if (!confirm('⚠️ ТОЧНО очистить ВСЮ историю, досье и статистику?')) return;
                if (!confirm('🔄 Это действие НЕЛЬЗЯ отменить! Продолжить?')) return;

                localStorage.removeItem('daily_goals_db_v3');
                localStorage.removeItem('user_profile_dossier');
                localStorage.removeItem('user_avatar_img');

                document.getElementById('avatar-container').innerHTML =
                    '👤<div class="upload-overlay">📷</div>';
                ['lastname', 'firstname', 'middlename', 'city', 'age'].forEach(f => {
                    document.getElementById(`user-${f}`).value = '';
                });
                DayManager._clearForm();
                document.getElementById('streak-count').textContent = '0';
                document.getElementById('today-status').textContent = '';

                Toast.show('🗑 Вся база очищена!', 'warning');
            }
        };

        // ===================================================================
        //  PIN MANAGER
        // ===================================================================
        const PinManager = {
            init() {
                const savedPin = localStorage.getItem('user_pin');
                const screen = document.getElementById('lock-screen');

                if (savedPin) {
                    screen.style.display = 'flex';
                    document.getElementById('pin-input').focus();
                } else {
                    const want = confirm('🔒 Установить PIN-код для защиты дневника?');
                    if (want) {
                        const newPin = prompt('Введите 4 цифры PIN-кода:');
                        if (newPin && newPin.length === 4 && /^\d{4}$/.test(newPin)) {
                            localStorage.setItem('user_pin', newPin);
                            Toast.show('🔐 PIN-код установлен!', 'success');
                            screen.style.display = 'flex';
                            document.getElementById('pin-input').focus();
                        } else if (newPin !== null) {
                            Toast.show('❌ PIN должен быть 4 цифры', 'error');
                        }
                    }
                }
            },

            check() {
                const savedPin = localStorage.getItem('user_pin');
                const entered = document.getElementById('pin-input').value;

                if (entered === savedPin) {
                    document.getElementById('lock-screen').style.display = 'none';
                    Toast.show('🔓 Добро пожаловать!', 'success');
                } else {
                    Toast.show('❌ Неверный PIN-код!', 'error');
                    document.getElementById('pin-input').value = '';
                    document.getElementById('pin-input').focus();
                }
            }
        };

        // ===================================================================
        //  INIT
        // ===================================================================
        function init() {
            ThemeManager.init();
            UI.updateDate();
            UI.updateStreak();
            ProfileManager.load();
            DayManager.load();
            PinManager.init();

            document.getElementById('pin-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') PinManager.check();
            });
        }

        // Глобальные для onclick
        window.changeTheme = (theme) => ThemeManager.change(theme);
        window.checkPin = () => PinManager.check();
        window.uploadAvatar = (input) => ProfileManager.uploadAvatar(input);
        window.startVoice = (id, btn) => VoiceInput.start(id, btn);
        window.saveToday = () => DayManager.save();
        window.openSection = (name, btn) => UI.openSection(name, btn);
        window.switchArchiveTab = (tab, btn) => ArchiveManager.switchTab(tab, btn);
        window.exportData = () => BackupManager.export();
        window.resetData = () => BackupManager.reset();

        document.addEventListener('DOMContentLoaded', init);
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            init();
        }
    </script>

</body>
</html>
